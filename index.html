<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>משימות Moodle</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3b5bdb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משימות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --mixk:#000; --mixp:68%;
  --bg:#f4f6fb; --card:#ffffff; --text:#1d2433; --muted:#667085; --line:#e4e8f1;
  --accent:#3b5bdb; --accent-d:#2f49b3; --accent-soft:#e8edff; --ok:#2b8a3e; --warn:#e8590c; --err:#c92a2a;
  --new:#1c7ed6; --newbg:#e7f1fd; --updbg:#fff0e0; --okbg:#e6f6ea; --row:#f7f8fc; --track:#eceff5;
}
@media (prefers-color-scheme: dark){
  :root{
    --mixk:#fff; --mixp:88%;
    --bg:#12151d; --card:#1a1f2b; --text:#e7eaf2; --muted:#98a2b3; --line:#2a3141;
    --accent:#7c93ff; --accent-d:#9aabff; --accent-soft:#252d4d; --ok:#69db7c; --warn:#ffa94d; --err:#ff8787;
    --new:#74c0fc; --newbg:#1c2b3d; --updbg:#3a2a1a; --okbg:#1d3326; --row:#202637; --track:#252a36;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Heebo",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.link{border:0;background:none;color:var(--accent);padding:6px 4px}
button:disabled{opacity:.5}
input[type=text],input[type=search],input[type=password],select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
select{width:auto}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--err)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.top .ttl b{font-size:18px}
.top .ttl .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;padding:0;font-size:19px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.ic.spin{animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
main{max-width:720px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

#setup .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:10px}
#setup h2{margin:0 0 6px;font-size:20px}
#setup ol{padding-inline-start:20px;margin:8px 0}
#setup li{margin:4px 0}
#setup label{display:block;font-weight:600;margin:14px 0 6px}
#setup input{direction:ltr;text-align:left}
#setup .step{margin:14px 0}
.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:11px 14px;margin-top:8px;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
details{margin:10px 0}
summary{cursor:pointer;padding:4px 0;font-weight:600}

.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner.err{background:var(--updbg);color:var(--err)}
.banner.info{background:var(--newbg)}
#sum{margin:2px 2px 10px;color:var(--muted);font-size:14px}
#sum b{color:var(--text)}
#sum .late{color:var(--err)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{--c:#888;flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;opacity:.55;user-select:none}
.chip.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip .n{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;background:var(--card)}
.seg button{flex:1;border:0;border-radius:0;padding:9px 6px;background:none;font-size:14px}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
#q{margin-bottom:6px}

.grp{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:700;user-select:none;cursor:pointer}
.grp .tw{width:14px;color:var(--muted);font-size:13px}
.grp .cnt{font-weight:400;color:var(--muted);font-size:13px}
.grp.late{color:var(--err)}
.grp.old,.grp.nodue,.grp.done{color:var(--muted)}
.grp.cg{color:var(--ct);border-inline-start:5px solid var(--c);padding-inline-start:8px}
.task,.grp,.chip{--ct:color-mix(in srgb,var(--c) var(--mixp),var(--mixk))}
.task{--c:var(--line);position:relative;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.task.done{opacity:.85}
.task.hid{opacity:.45}
.task .x{position:absolute;inset-block-start:4px;inset-inline-end:4px;width:40px;height:40px;padding:0;border:0;background:none;color:var(--muted);font-size:15px}
.task .tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-inline-end:34px}
.task .tname{font-weight:700;font-size:16px;width:100%}
.task .tc{font-size:12.5px;padding:1px 9px;border-radius:99px;color:var(--ct);background:color-mix(in srgb,var(--c) 13%,transparent);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .due{margin-top:6px;font-size:14px}
.task .rel{color:var(--muted)}
.cd{color:var(--muted);font-variant-numeric:tabular-nums}
.cd.soon{color:var(--warn);font-weight:700}
.cd.late{color:var(--err);font-weight:600}
#sum .next{margin-top:3px}
.task .sub{color:var(--muted);font-size:13px}
.task pre{white-space:pre-wrap;font:inherit;margin:6px 0;font-size:14.5px}
.task .act{margin-top:8px}
.task a{color:var(--accent);text-decoration:none;font-weight:600;display:inline-block;padding:6px 0}
.st{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.st.submitted{background:var(--okbg);color:var(--ok)}
.st.draft{background:var(--updbg);color:var(--warn)}
.st.none{background:var(--newbg);color:var(--new)}
.st.late{background:var(--updbg);color:var(--err)}
.st.na,.st.unknown{background:var(--track);color:var(--muted)}
.st.grade{background:var(--accent-soft);color:var(--accent)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.diag{margin-top:18px;font-size:13px;color:var(--muted)}
.diag div{direction:ltr;text-align:left;color:var(--err);word-break:break-word}

.sheet{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px max(20px,env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow input[type=color]{width:38px;height:30px;border:0;padding:0;background:none}
.srow .cn{display:flex;align-items:center;gap:8px;min-width:0}
.srow .cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:fit-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:40;white-space:pre-line;font-size:14px}
.langrow{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 4px}
.langrow select{font-size:14px;padding:5px 8px}
</style>
</head>
<body>
<header class="top">
  <div class="ttl"><b data-i18n="appTitle">משימות</b><span class="hint" id="upd"></span></div>
  <button class="ic" id="bRefresh" data-i18n-aria="refresh" aria-label="רענן" hidden>⟳</button>
  <button class="ic" id="bSet" data-i18n-aria="settings" aria-label="הגדרות" hidden>⚙</button>
</header>

<main>
<section id="setup" hidden>
  <div class="card">
    <div class="langrow"><span aria-hidden="true">🌐</span><select class="langSel" aria-label="Language"><option value="he">עברית</option><option value="en">English</option><option value="fr">Français</option></select></div>
    <h2 data-i18n="setupTitle"></h2>
    <div class="hint" data-i18n="setupHint"></div>
    <div class="step"><b>1.</b> <span data-i18n="step1"></span>
      <a class="btn primary" id="bGet" target="_blank" rel="noopener noreferrer" data-i18n="getToken"></a></div>
    <div class="step"><b>2.</b> <span data-i18n-html="step2"></span>
      <div class="hint" data-i18n="step2hint"></div></div>
    <div class="step"><b>3.</b> <span data-i18n="step3"></span>
      <button class="primary" id="bPaste" style="width:100%" data-i18n="pasteConnect"></button></div>
    <label for="tok" data-i18n="manual"></label>
    <input type="password" id="tok" autocomplete="off" data-i18n-ph="tokPh">
    <button id="bConnect" style="width:100%;margin-top:10px" data-i18n="connect"></button>
    <div class="err" id="setupErr"></div>
    <details>
      <summary data-i18n="otherSite"></summary>
      <input type="text" id="site" autocomplete="off">
    </details>
    <div class="hint" data-i18n-html="pcHint"></div>
  </div>
</section>

<section id="main" hidden>
  <div id="banner" class="banner" hidden></div>
  <div id="sum"></div>
  <div class="chips" id="chips"></div>
  <div class="ctl">
    <div class="seg" id="seg">
      <button data-f="open" class="on" data-i18n="fOpen"></button>
      <button data-f="all" data-i18n="fAll"></button>
      <button data-f="done" data-i18n="fDone"></button>
    </div>
    <select id="sort" data-i18n-aria="sort">
      <option value="urgency" data-i18n="sUrgency"></option>
      <option value="course" data-i18n="sCourse"></option>
      <option value="date" data-i18n="sDate"></option>
    </select>
  </div>
  <input type="search" id="q" autocomplete="off" data-i18n-ph="searchPh">
  <div id="list"></div>
  <div class="diag" id="diag"></div>
</section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h3><span data-i18n="settings"></span> <button class="link" id="bClose" data-i18n="close"></button></h3>
    <div class="srow"><span data-i18n="language"></span><select class="langSel"><option value="he">עברית</option><option value="en">English</option><option value="fr">Français</option></select></div>
    <div class="srow"><span data-i18n="oldLabel"></span><select id="old"></select></div>
    <div class="srow"><span><span data-i18n="showHidden"></span> (<span id="hidn">0</span>)</span><input type="checkbox" id="showHid"></div>
    <div style="margin-top:14px;font-weight:700" data-i18n="coursesColors"></div>
    <div class="hint" data-i18n="coursesHint"></div>
    <div id="clist"></div>
    <div class="srow" style="margin-top:8px"><span class="hint" id="who"></span></div>
    <button id="bLogout" style="width:100%;margin-top:8px;color:var(--err)" data-i18n="logout"></button>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
const DEFAULT_SITE = "https://moodle.jct.ac.il";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("mt_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mt_" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("mt_" + k); } catch (e) {} },
};
function toast(m, ms) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms || 3500); }

/* ---------- languages ---------- */
const I18N = {

async function fetchAll() {

  };

  const raw = await call("core_enrol_get_users_courses", { userid: info.userid });
  const courses = raw.map(c => ({ id: Number(c.id), name: stripHtml(c.fullname || c.shortname || String(c.id)), end: Number(c.enddate) || 0 }));
  const ids = courses.map(c => c.id), names = Object.fromEntries(courses.map(c => [c.id, c.name]));

  const ar = (await safe("mod_assign_get_assignments", { courseids: ids })) || {};
  const assigns = [];
  for (const c of ar.courses || []) for (const a of c.assignments || []) assigns.push(Object.assign({}, a, { _cid: Number(c.id) }));
  const subs = await pool(assigns, 4, a => safe("mod_assign_get_submission_status", { assignid: a.id }));

    const status = a.nosubmissions ? "na" : !r ? "unknown" : rawSt === "submitted" ? "submitted" : rawSt === "draft" ? "draft" : "none";
    const due = a.duedate || 0, ext = last.extensionduedate || 0, fb = (r && r.feedback) || {};

      status, grade: (last.graded || fb.gradefordisplay) ? stripHtml(fb.gradefordisplay || "") : "",

  const due = x.due ? "<b>" + esc(when(x.due)) + "</b><br>" + cdSpan(x.due, now) + (x.extended ? ' <span class="rel">· ' + esc(t("extended")) + "</span>" : "") : '<span class="rel">' + esc(t("noDue")) + "</span>";
  const extra = (x.from && x.from > now ? '<div class="sub">' + esc(t("opens", when(x.from))) + "</div>" : "") + (x.cutoff ? '<div class="sub">' + esc(t("cutoff", when(x.cutoff))) + "</div>" : "");
  const body = (x.intro || x.files.length) ? "<details><summary>" + esc(t("details")) + "</summary><pre>" + esc(x.intro || "") + "</pre>" + (x.files.length ? '<div class="sub">📎 ' + x.files.map(esc).join(", ") + "</div>" : "") + "</details>" : "";
  const link = /^https?:\/\//.test(x.url) ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t("openSite")) + "</a>" : "";
  return '<div class="task' + (g === "done" ? " done" : "") + (hid ? " hid" : "") + '" style="--c:' + colorOf(x.cid) + '">' +
    '<button class="x" data-hide="' + esc(x.key) + '" aria-label="' + esc(hid ? t("restore") : t("hide")) + '">' + (hid ? "↩" : "✕") + "</button>" +
    '<div class="tl"><span class="tname"><bdi>' + esc(x.name) + "</bdi></span>" + chip + '<span class="tc">' + esc(t(TYPE[x.type]) || "") + " · <bdi>" + esc(shortName(x.course)) + "</bdi></span></div>" +
    '<div class="due">' + due + "</div>" + extra + body + (link ? '<div class="act">' + link + "</div>" : "") + "</div>";
}
function render() {
  const d = V.data;
  $("#bRefresh").classList.toggle("spin", V.loading);
  $("#upd").textContent = V.loading && !d ? t("loading") : d ? (V.loading ? t("refreshing") + " · " : "") + t("updated", ago(d.at)) : "";
  const bn = $("#banner");
  if (V.err) { bn.hidden = false; bn.className = "banner err"; bn.textContent = V.err + (d ? t("lastData") : ""); }
  else bn.hidden = true;
  if (!d) { $("#list").innerHTML = V.loading ? '<div class="empty">' + esc(t("loadingTasks")) + "</div>" : ""; $("#sum").textContent = ""; $("#chips").innerHTML = ""; return; }
  const now = Math.floor(Date.now() / 1000);
  // course chips: courses that have tasks, in enrolment order
  const withTasks = new Set(d.tasks.map(x => x.cid));
  const cs = d.courses.filter(c => withTasks.has(c.id));
  $("#chips").innerHTML = cs.map(c => {
    const n = d.tasks.filter(x => x.cid === c.id && !isDone(x) && x.due && groupOf(x, now) !== "old" && !P.hidden.includes(x.key)).length;
    return '<span class="chip' + (isOff(c.id) ? "" : " on") + '" data-c="' + c.id + '" style="--c:' + colorOf(c.id) + '"><i></i><bdi>' + esc(shortName(c.name)) + "</bdi>" + (n ? ' <span class="n">' + n + "</span>" : "") + "</span>";
  }).join("");
  $$("#seg button").forEach(b => b.classList.toggle("on", b.dataset.f === P.filter));
  $("#sort").value = P.sort;

  const shown = d.tasks.filter(visible), buckets = [];
  const isOpen = (k, def) => V.openG[k] === undefined ? def : V.openG[k];
  if (P.sort === "urgency") {
    const by = {}; GROUPS.forEach(([k]) => by[k] = []);
    shown.forEach(x => by[groupOf(x, now)].push(x));
    for (const [k, label] of GROUPS) if (by[k].length) buckets.push({ key: "u:" + k, label: t(label), cls: k, items: by[k].sort((a, b) => k === "done" ? b.due - a.due : dueKey(a) - dueKey(b)), open: isOpen("u:" + k, G_OPEN[k]) });
  } else if (P.sort === "course") {
    const tier = x => { const g = groupOf(x, now); return g === "done" ? 3 : g === "old" ? 2 : g === "nodue" ? 1 : 0; };
    const ids = d.courses.map(c => c.id).filter(id => shown.some(x => x.cid === id));
    shown.forEach(x => { if (!ids.includes(x.cid)) ids.push(x.cid); });
    for (const id of ids) {
      const items = shown.filter(x => x.cid === id).sort((a, b) => tier(a) - tier(b) || dueKey(a) - dueKey(b));
      buckets.push({ key: "c:" + id, label: shortName(items[0].course), cls: "cg", color: colorOf(id), items, open: isOpen("c:" + id, true) });
    }
  } else buckets.push({ key: "d", label: "", cls: "plain", items: shown.slice().sort((a, b) => dueKey(a) - dueKey(b)), open: true });
  let h = "";
  for (const b of buckets) {
    if (b.cls !== "plain") h += '<div class="grp ' + b.cls + '" data-g="' + esc(b.key) + '"' + (b.color ? ' style="--c:' + b.color + '"' : "") + '><span class="tw">' + (b.open ? "▾" : t("closedArrow")) + "</span><bdi>" + esc(b.label) + '</bdi> <span class="cnt">' + b.items.length + "</span></div>";
    if (b.open) h += b.items.map(x => card(x, now, groupOf(x, now))).join("");
  }
  $("#list").innerHTML = h || '<div class="empty">' + esc(d.tasks.length ? t("noMatch") : t("noTasks")) + "</div>";

  const relv = d.tasks.filter(x => !isOff(x.cid) && !P.hidden.includes(x.key) && !isDone(x) && groupOf(x, now) !== "old");
  const dated = relv.filter(x => x.due), late = dated.filter(x => x.due < now), next = dated.filter(x => x.due >= now).sort((a, b) => a.due - b.due)[0];
  $("#sum").innerHTML = t("sumOpen", dated.length) + (late.length ? ' · <b class="late">' + esc(t("sumLate", late.length)) + "</b>" : "") +
    (next ? '<div class="next">' + esc(t("next")) + " <b><bdi>" + esc(next.name) + "</bdi></b> · " + cdSpan(next.due, now) + "</div>" : "");
  const urgent = dated.filter(x => ["late", "today", "week"].includes(groupOf(x, now))).length;
  try { if (navigator.setAppBadge) urgent ? navigator.setAppBadge(urgent) : navigator.clearAppBadge(); } catch (e) {}
  $("#diag").innerHTML = d.diag && d.diag.length ? "<details><summary>" + esc(t("diag", d.diag.length)) + "</summary>" + d.diag.map(x => "<div>" + esc(x) + "</div>").join("") + "</details>" : "";
}
function renderSheet() {
  const d = V.data; $("#old").value = String(P.old_days); $("#hidn").textContent = P.hidden.length; $("#showHid").checked = V.showHid;
  $("#who").innerHTML = d ? (d.user ? "<bdi>" + esc(d.user) + "</bdi> · " : "") + "<bdi>" + esc(M.url.replace(/^https?:\/\//, "")) + "</bdi>" : esc(M.url);
  $("#clist").innerHTML = d ? d.courses.map(c => '<div class="srow"><label class="cn" data-tc="' + c.id + '"><input type="checkbox"' + (isOff(c.id) ? "" : " checked") + "><span><bdi>" + esc(shortName(c.name)) + "</bdi></span></label>" +
    '<input type="color" data-cc="' + c.id + '" value="' + colorOf(c.id) + '"></div>').join("") : "";
}

/* ---------- actions ---------- */
async function refresh() {
  if (V.loading || !M.token) return;
  V.loading = true; V.err = null; render();
  try {
    const d = await fetchAll(); applySeen(d.courses); migrateColors(d.courses); V.data = d; LS.set("cache", d);
  } catch (e) {
    V.err = e.message;
    if (e.code === "invalidtoken") { V.loading = false; render(); return showSetup(e.message); }
  }
  V.loading = false; render();
}
function launchUrl(site) {
  // Moodle's mobile-app launch page. confirmed=1 makes it show a link with the token (instead of only trying to open the app), on Android too
  return normUrl(site) + "/admin/tool/mobile/launch.php?service=moodle_mobile_app&passport=" + Math.floor(Math.random() * 1e9) + "&urlscheme=moodlemobile&confirmed=1";
}
function showSetup(err) {
  $("#setup").hidden = false; $("#main").hidden = true; $("#bRefresh").hidden = true; $("#bSet").hidden = true;
  $("#site").value = LS.get("site", DEFAULT_SITE); $("#setupErr").textContent = err || ""; $("#upd").textContent = "";
  $("#bGet").href = launchUrl($("#site").value);
}
function showMain() {
  M.url = LS.get("site", DEFAULT_SITE); M.token = LS.get("token", "");
  $("#setup").hidden = true; $("#main").hidden = false; $("#bRefresh").hidden = false; $("#bSet").hidden = false;
  render(); refresh();
}
function importFromHash() {
  const h = location.hash.slice(1); if (!h) return false;
  const q = new URLSearchParams(h), tk = q.get("t");
  history.replaceState(null, "", location.pathname + location.search);   // the token does not stay in the address bar or history
  if (!tk || !/^[A-Za-z0-9]+$/.test(tk)) return false;
  LS.set("token", tk); LS.set("site", normUrl(q.get("u") || DEFAULT_SITE)); LS.del("cache"); V.data = null;
  const p = q.get("p");
  if (p) { try { const x = JSON.parse(b64dec(p)); for (const k of ["off", "hidden", "old_days", "sort", "colors"]) if (x[k] !== undefined) P[k] = x[k]; savePrefs(); LS.set("seen", "imported"); LS.del("pal2"); } catch (e) {} }
  toast(t("phoneConnected"));
  return true;
}

async function connectWith(raw) {
  let tok; try { tok = extractToken(raw); } catch (e) { $("#setupErr").textContent = e.message; return; }
  if (!tok) { $("#setupErr").textContent = t("missingToken"); return; }
  if (!/^[A-Za-z0-9]{10,}$/.test(tok)) { $("#setupErr").textContent = t("notToken"); return; }
  $("#setupErr").textContent = t("checking");
  M.url = normUrl($("#site").value); M.token = tok;
  try { await call("core_webservice_get_site_info"); LS.set("token", tok); LS.set("site", M.url); LS.del("cache"); V.data = null; $("#tok").value = ""; $("#setupErr").textContent = ""; showMain(); toast(t("connected")); }
  catch (e) { $("#setupErr").textContent = e.message; }
}
$("#bConnect").onclick = () => connectWith($("#tok").value);
$("#tok").addEventListener("keydown", e => { if (e.key === "Enter") connectWith($("#tok").value); });
$("#bPaste").onclick = async () => {
  let txt = "";
  try { txt = await navigator.clipboard.readText(); } catch (e) {}
  if (!txt) { $("#tok").focus(); $("#setupErr").textContent = t("clipFail"); return; }
  $("#tok").value = txt; connectWith(txt);
};
$("#site").addEventListener("input", () => { $("#bGet").href = launchUrl($("#site").value); });
$$(".langSel").forEach(s => s.addEventListener("change", e => applyLang(e.target.value)));
$("#bRefresh").onclick = () => refresh();
$("#bSet").onclick = () => { renderSheet(); $("#sheet").hidden = false; };
$("#bClose").onclick = () => $("#sheet").hidden = true;
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") $("#sheet").hidden = true; });
$("#old").onchange = e => { P.old_days = Number(e.target.value); savePrefs(); render(); };
$("#showHid").onchange = e => { V.showHid = e.target.checked; render(); };
$("#clist").addEventListener("change", e => {
  const tc = e.target.closest("[data-tc]");
  if (tc) { const id = Number(tc.dataset.tc); P.off = e.target.checked ? P.off.filter(x => x !== id) : [...new Set([...P.off, id])]; savePrefs(); render(); }
});
$("#clist").addEventListener("input", e => { if (e.target.dataset.cc) { P.colors[e.target.dataset.cc] = e.target.value; savePrefs(); render(); } });
$("#bLogout").onclick = () => {
  if (!confirm(t("logoutConfirm"))) return;
  ["token", "cache", "seen"].forEach(k => LS.del(k)); V.data = null; M.token = ""; $("#sheet").hidden = true;
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch (e) {}
  showSetup();
};
$("#chips").addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (!c) return;
  const id = Number(c.dataset.c); P.off = isOff(id) ? P.off.filter(x => x !== id) : [...P.off, id]; savePrefs(); render();
});
$("#seg").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { P.filter = b.dataset.f; savePrefs(); render(); } });
$("#sort").onchange = e => { P.sort = e.target.value; savePrefs(); render(); };
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { V.q = e.target.value.trim(); render(); }, 120); });
$("#list").addEventListener("click", e => {
  const x = e.target.closest("[data-hide]");
  if (x) { const k = x.dataset.hide; P.hidden = P.hidden.includes(k) ? P.hidden.filter(y => y !== k) : [...P.hidden, k]; savePrefs(); render(); return; }
  const g = e.target.closest("[data-g]");
  if (g) { const k = g.dataset.g, def = k.startsWith("u:") ? G_OPEN[k.slice(2)] : true; V.openG[k] = !(V.openG[k] === undefined ? def : V.openG[k]); render(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && M.token && (!V.data || Date.now() / 1000 - V.data.at > 300)) refresh(); });
setInterval(() => { if (!document.hidden && V.data) render(); }, 60000);
setInterval(tick, 1000);
window.addEventListener("online", () => { if (M.token) refresh(); });

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
applyLang();
importFromHash();
if (LS.get("token", "")) showMain(); else showSetup();
</script>
</body>
</html>
