# מעלה את שרת ההתראות (התיקייה push/) ל-Cloudflare בכל שינוי בו, או בלחיצה ידנית ב-Actions.
# צריך Secret אחד בהגדרות הריפו: CLAUDEFLARE (או CLOUDFLARE_API_TOKEN) (מספר החשבון כתוב ב-push/wrangler.toml).
# התוצאה (הכתובת של השרת, או השגיאה) מופיעה כהודעה בסיכום הריצה.
name: Deploy push server
on:
  push:
    branches: [main]
    paths: ["push/**", ".github/workflows/push-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        working-directory: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLAUDEFLARE }}
          AS_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            if [ -n "$AS_VAR" ]; then echo "::error::CLOUDFLARE_API_TOKEN was saved as a Variable, not a Secret. Move it to the Secrets tab."; exit 1; fi
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not visible to this run (Settings → Secrets and variables → Actions → Repository secrets)"; exit 1
          fi
          set +e
          npx --yes wrangler@4.158.0 deploy > out.txt 2>&1; st=$?
          cat out.txt
          url=$(grep -o 'https://moodle-task-push\.[a-z0-9-]*\.workers\.dev' out.txt | head -1)
          if [ $st -ne 0 ]; then
            msg=$(grep -v '^\s*$' out.txt | tail -25 | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=wrangler deploy failed::$msg"; exit $st
          fi
          echo "::notice title=Push server URL::$url"
          sleep 5; key=$(curl -fsS "$url/key" || echo FAILED)
          echo "::notice title=Push server /key::$key"
          # the calendar feed, the way a calendar app sees it: upload a test calendar, read it back with a Google-like fetcher, empty it
          k=smoke$(head -c 18 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')
          ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MoodlePro//EN\r\nX-WR-CALNAME:MoodlePro\r\nBEGIN:VEVENT\r\nUID:smoke-1\r\nDTSTAMP:20261109T000000Z\r\nDTSTART:20261201T080000Z\r\nDTEND:20261201T083000Z\r\nSUMMARY:smoke\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n'
          up=$(curl -sS -X POST "$url/feed" -H "Origin: https://aorizoro.github.io" -H "Content-Type: application/json" --data "{\"key\":\"$k\",\"ics\":\"$ics\"}" || echo FAILED)
          h=$(curl -sSI -A "Google-Calendar-Importer" "$url/feed/$k.ics" | tr -d '\r' | grep -i '^content-type\|^HTTP' | tr '\n' ' ')
          body=$(curl -sS -A "Google-Calendar-Importer" "$url/feed/$k.ics" | tr -d '\r' | grep -c 'SUMMARY:smoke')
          stop=$(curl -sS -X POST "$url/feed/stop" -H "Origin: https://aorizoro.github.io" -H "Content-Type: application/json" --data "{\"key\":\"$k\"}" || echo FAILED)
          after=$(curl -sS "$url/feed/$k.ics" | tr -d '\r' | grep -c 'SUMMARY:smoke')
          echo "::notice title=Calendar feed check::upload=$up | head=$h | events served=$body | stop=$stop | after stop=$after"
          sleep 90; beta=$(curl -sS https://aorizoro.github.io/moodle-task/beta/ | grep -o 'APP_VERSION = "[^"]*"' | head -1)
          root=$(curl -sS https://aorizoro.github.io/moodle-task/ | grep -o 'APP_VERSION = "[^"]*"' | head -1)
          echo "::notice title=Beta page::$beta"
          echo "::notice title=Main page::$root"
