<script>
/* ---------- themes: ready-made looks plus a custom one. Applied here, in <head>, so the page never flashes the wrong colours ---------- */
const THEMES = [
  { id: "auto", g: "base", he: "מקורי (לפי הטלפון)", en: "Original (follows phone)", fr: "Original (selon le téléphone)" },
  { id: "classic", g: "base", he: "קלאסי בהיר", en: "Classic light", fr: "Classique clair", c: { bg: "#f4f6fb", card: "#ffffff", text: "#1d2433", muted: "#667085", line: "#e4e8f1", accent: "#3b5bdb" } },
  { id: "night", g: "base", he: "קלאסי כהה", en: "Classic dark", fr: "Classique sombre", c: { bg: "#12151d", card: "#1a1f2b", text: "#e7eaf2", muted: "#98a2b3", line: "#2a3141", accent: "#7c93ff" } },
  { id: "blossom", g: "pastel", he: "פריחה", en: "Blossom", fr: "Floraison", c: { bg: "#fdf2f6", card: "#fffafc", text: "#3d2533", muted: "#8a6b7b", line: "#f3dbe5", accent: "#d9668f" } },
  { id: "mint", g: "pastel", he: "מנטה", en: "Mint", fr: "Menthe", c: { bg: "#eefaf5", card: "#fbfffd", text: "#1f3a33", muted: "#5f7f76", line: "#d3eee3", accent: "#2f9e7e" } },
  { id: "lavender", g: "pastel", he: "לבנדר", en: "Lavender", fr: "Lavande", c: { bg: "#f3f0fc", card: "#fcfbff", text: "#2b2545", muted: "#776f99", line: "#e2dcf5", accent: "#7b61d1" } },
  { id: "peach", g: "pastel", he: "אפרסק", en: "Peach", fr: "Pêche", c: { bg: "#fff4ec", card: "#fffbf8", text: "#3b2a20", muted: "#8c6e5c", line: "#f6e0d0", accent: "#e2703a" } },
  { id: "sky", g: "pastel", he: "שמיים", en: "Sky", fr: "Ciel", c: { bg: "#eef6fd", card: "#fbfdff", text: "#1b2d42", muted: "#5f7690", line: "#d6e6f5", accent: "#2f86d6" } },
  { id: "lemon", g: "pastel", he: "לימון", en: "Lemon", fr: "Citron", c: { bg: "#fffbe6", card: "#fffef6", text: "#33300f", muted: "#7d7650", line: "#f0e7b8", accent: "#c99a00" } },
  { id: "marker", g: "vivid", he: "מרקר צהוב", en: "Highlighter", fr: "Surligneur", c: { bg: "#fffde0", card: "#ffffff", text: "#111111", muted: "#555555", line: "#e6e0a0", accent: "#ffe600" } },
  { id: "pop", g: "vivid", he: "ורוד זוהר", en: "Hot pink", fr: "Rose vif", c: { bg: "#fff0f8", card: "#ffffff", text: "#1a0a14", muted: "#6b4b5e", line: "#ffc2e2", accent: "#ff1f8e" } },
  { id: "electric", g: "vivid", he: "כחול חשמלי", en: "Electric blue", fr: "Bleu électrique", c: { bg: "#eef2ff", card: "#ffffff", text: "#0b1033", muted: "#4d5680", line: "#c9d4ff", accent: "#0047ff" } },
  { id: "tangerine", g: "vivid", he: "מנדרינה", en: "Tangerine", fr: "Mandarine", c: { bg: "#fff3e6", card: "#ffffff", text: "#2a1606", muted: "#7a5a40", line: "#ffd2a6", accent: "#ff6a00" } },
  { id: "lime", g: "vivid", he: "ליים", en: "Lime", fr: "Citron vert", c: { bg: "#f4ffe0", card: "#ffffff", text: "#142006", muted: "#56693a", line: "#d6f0a8", accent: "#7ed000" } },
  { id: "oled", g: "dark", he: "שחור מוחלט", en: "Pure black", fr: "Noir absolu", c: { bg: "#000000", card: "#0e0e10", text: "#f2f2f2", muted: "#9a9aa0", line: "#232327", accent: "#8ab4ff" } },
  { id: "neon", g: "dark", he: "ניאון", en: "Neon", fr: "Néon", c: { bg: "#0b0b10", card: "#15151d", text: "#f0f0ff", muted: "#9a9ab5", line: "#2a2a3a", accent: "#39ff14", ok: "#39ff14", warn: "#ffd60a", err: "#ff2e63" } },
  { id: "cyber", g: "dark", he: "סייבר", en: "Cyber", fr: "Cyber", c: { bg: "#0d0221", card: "#1a0b3a", text: "#f6e9ff", muted: "#a98ccc", line: "#341a66", accent: "#ff2bd6", ok: "#2de2e6", warn: "#ffd319", err: "#ff3864" } },
  { id: "forest", g: "dark", he: "יער", en: "Forest", fr: "Forêt", c: { bg: "#0f1a14", card: "#16251d", text: "#e3efe7", muted: "#8fa898", line: "#24382c", accent: "#5fd08a" } },
  { id: "ocean", g: "dark", he: "אוקיינוס", en: "Ocean", fr: "Océan", c: { bg: "#0b1526", card: "#12203a", text: "#e4eefc", muted: "#8ea3c2", line: "#1f3254", accent: "#4cc9f0" } },
  { id: "grape", g: "dark", he: "ענבים", en: "Grape", fr: "Raisin", c: { bg: "#1e1b2e", card: "#282540", text: "#f1effa", muted: "#a49fc4", line: "#38345a", accent: "#bd93f9" } },
  { id: "coffee", g: "dark", he: "קפה", en: "Coffee", fr: "Café", c: { bg: "#1c1612", card: "#26201a", text: "#f1e8df", muted: "#a8968a", line: "#3a3029", accent: "#e0a96d" } },
  { id: "dusk", g: "dark", he: "פסטל לילי", en: "Pastel night", fr: "Pastel de nuit", c: { bg: "#1d1b26", card: "#262433", text: "#ece9f5", muted: "#a7a2bd", line: "#363347", accent: "#f5b8d0", ok: "#a8e6cf", warn: "#ffd3a5", err: "#ff9aa2" } },
];
const TH_FIELDS = ["bg", "card", "text", "muted", "line", "accent", "ok", "warn", "err"];
const TH_STATUS = { light: { ok: "#2b8a3e", warn: "#e8590c", err: "#c92a2a" }, dark: { ok: "#69db7c", warn: "#ffa94d", err: "#ff8787" } };
const TH_VARS = ["--bg", "--card", "--text", "--muted", "--line", "--accent", "--accent-t", "--accent-d", "--accent-soft", "--on-accent", "--ok", "--warn", "--err", "--new", "--newbg", "--updbg", "--okbg", "--row", "--track", "--mixk", "--mixp"];
const thRGB = h => { h = String(h).replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) || 0); };
const thHex = a => "#" + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
const thMix = (a, b, t) => { const x = thRGB(a), y = thRGB(b); return thHex(x.map((v, i) => v + (y[i] - v) * t)); };     // t = share of b
const thLum = h => { const [r, g, b] = thRGB(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const thContrast = (a, b) => { const x = thLum(a), y = thLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const thIsDark = c => thLum(c.bg) < 0.2;
/* the few colours a theme sets -> every colour the page uses (soft backgrounds, readable text on the main colour, …) */
function themeVars(c0) {
  const dark = thIsDark(c0), c = Object.assign({}, TH_STATUS[dark ? "dark" : "light"], c0);
  let at = c.accent; for (let i = 0; i < 12 && thContrast(at, c.card) < 3.2; i++) at = thMix(at, c.text, 0.2);    // the main colour as text: darkened until readable
  return { dark, v: { "--bg": c.bg, "--card": c.card, "--text": c.text, "--muted": c.muted, "--line": c.line, "--accent": c.accent, "--accent-t": at,
    "--accent-d": thMix(c.accent, dark ? "#ffffff" : "#000000", 0.15), "--accent-soft": thMix(c.card, c.accent, dark ? 0.22 : 0.14),
    "--on-accent": thContrast("#ffffff", c.accent) >= 2.5 ? "#ffffff" : "#111111", "--ok": c.ok, "--warn": c.warn, "--err": c.err,
    "--new": at, "--newbg": thMix(c.card, c.accent, dark ? 0.2 : 0.1), "--updbg": thMix(c.card, c.warn, dark ? 0.2 : 0.12), "--okbg": thMix(c.card, c.ok, dark ? 0.2 : 0.12),
    "--row": thMix(c.card, c.text, dark ? 0.05 : 0.025), "--track": thMix(c.bg, c.text, dark ? 0.09 : 0.07), "--mixk": dark ? "#fff" : "#000", "--mixp": dark ? "88%" : "68%" } };
}
/* the colours a theme setting stands for (null = the original, which follows the phone's light/dark setting) */
function themeColors(th) {
  if (th && th.id === "custom" && th.c) return th.c;
  const p = THEMES.find(x => x.id === (th && th.id)); return p && p.c ? p.c : null;
}
function applyTheme(th) {
  const r = document.documentElement, c = themeColors(th), meta = document.querySelector('meta[name="theme-color"]');
  for (const k of TH_VARS) r.style.removeProperty(k);
  r.style.removeProperty("color-scheme"); r.dataset.theme = c ? (th.id || "custom") : "auto";
  if (!c) { if (meta) meta.content = "#3b5bdb"; return; }
  const t = themeVars(c); for (const k in t.v) r.style.setProperty(k, t.v[k]);
  r.style.colorScheme = t.dark ? "dark" : "light"; if (meta) meta.content = c.bg;
}
try { const k = (/\/beta\//.test(location.pathname) ? "mtb_" : "mt_") + "prefs"; applyTheme((JSON.parse(localStorage.getItem(k) || "{}") || {}).theme); } catch (e) {}
</script>
<style>
:root{
  --mixk:#000; --mixp:68%; --accent-t:var(--accent); --on-accent:#fff;
  --bg:#f4f6fb; --card:#ffffff; --text:#1d2433; --muted:#667085; --line:#e4e8f1;
  --accent:#3b5bdb; --accent-d:#2f49b3; --accent-soft:#e8edff; --ok:#2b8a3e; --warn:#e8590c; --err:#c92a2a;
  --new:#1c7ed6; --newbg:#e7f1fd; --updbg:#fff0e0; --okbg:#e6f6ea; --row:#f7f8fc; --track:#eceff5;
}
@media (prefers-color-scheme: dark){
  :root{
    --mixk:#fff; --mixp:88%;
    --bg:#12151d; --card:#1a1f2b; --text:#e7eaf2; --muted:#98a2b3; --line:#2a3141;
    --accent:#7c93ff; --accent-d:#9aabff; --accent-soft:#252d4d; --ok:#69db7c; --warn:#ffa94d; --err:#ff8787;
    --new:#74c0fc; --newbg:#1c2b3d; --updbg:#3a2a1a; --okbg:#1d3326; --row:#202637; --track:#252a36;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Heebo",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.link{border:0;background:none;color:var(--accent-t);padding:6px 4px}
button:disabled{opacity:.5}
input[type=text],input[type=search],input[type=password],select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
select{width:auto}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--err)}
[hidden]{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.top .ttl b{font-size:18px}
.top .logo{flex:none;width:34px;height:34px;border-radius:9px;box-shadow:0 2px 8px #2a186833}
.wm{font-weight:800;letter-spacing:-.01em;unicode-bidi:isolate}
.wm span{margin-inline-start:1px;background:linear-gradient(120deg,var(--accent-t),#7b5cff 60%,#e0a020);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.brand img{width:56px;height:56px;border-radius:15px;box-shadow:0 6px 18px #2a186840}
.brand .wm{font-size:26px;display:block;line-height:1.1}
.brand .hint{margin-top:2px}
.hint.by{font-weight:600;letter-spacing:.01em;opacity:.85}
.byset{text-align:center;margin-top:14px}
/* the login screen already says it in its own brand block, so the header's copy steps aside there */
body:has(#setup:not([hidden])) .top .by{display:none}
.top .ttl .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;padding:0;font-size:19px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.ic.spin{animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
main{max-width:720px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* ---------- layout: one tab at a time on every screen.
   phone: bottom tab bar · tablet: floating tab bar · computer: side bar (like Mail / Notes / Notion) ---------- */
body.app main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
body.app[data-view=dash] #tasks,body.app[data-view=dash] #ttv{display:none}
body.app[data-view=tasks] #dash,body.app[data-view=tasks] #ttv{display:none}
body.app[data-view=tt] #dash,body.app[data-view=tt] #tasks{display:none}
body.app[data-view=chat] #dash,body.app[data-view=chat] #tasks,body.app[data-view=chat] #ttv{display:none}
#chatv{display:none}body.app[data-view=chat] #chatv{display:block}
/* settings live in the tab bar now (phone + tablet) and in the side bar (computer): no gear in the header */
#bSet{display:none!important}
.tabbar .sbset{display:flex}
.sech{display:none}
.ptitle{display:none}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:12;display:flex;gap:4px;padding:6px 10px max(8px,env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line)}
.tabbar .sbrand{display:none}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);padding:4px 4px 2px;border-radius:14px}
.tabbar button b{font-weight:600}
.tabbar .ti{position:relative;display:grid;place-items:center;width:56px;height:30px;border-radius:99px;transition:background .2s}
.tabbar .ti .i{width:22px;height:22px}
.tabbar button.on{color:var(--accent-t)}
.tabbar button.on .ti{background:var(--accent-soft)}
.tabbar button.on b{font-weight:700}
.tabbar .badge{position:absolute;inset-block-start:-3px;inset-inline-end:6px;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:99px;background:var(--err);color:#fff;font-size:11px;font-weight:700;font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--card)}
@media (min-width:600px) and (max-width:999px){
  .tabbar{inset-inline:auto;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 32px));border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 10px 30px #0000001f,0 1px 3px #00000014}
  .tabbar button{flex-direction:row;justify-content:center;gap:6px;font-size:14px;padding:8px 6px;border-radius:18px}
  .tabbar .ti{width:auto;height:auto;background:none!important}
  .tabbar button.on{background:var(--accent-soft)}
}
@media (min-width:760px){
  main{max-width:1180px;padding-inline:24px}
  .sech{display:flex;align-items:baseline;gap:10px;font-size:22px;font-weight:800;margin:6px 2px 12px;letter-spacing:-.01em}
  .sech .hint{font-weight:400;font-size:13.5px}
  /* the overview: its cards on a grid, in the order the student arranged them */
  #dash{display:grid;column-gap:14px;row-gap:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;grid-auto-rows:6px;align-items:start}
  #dash > .dcard,#dash > .stats{margin:0 0 14px;align-self:start}
  #stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* tasks: two columns of cards */
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 12px;align-items:start}
  #list > :not(.task){grid-column:1/-1}
}
@media (min-width:1200px){
  #dash{grid-template-columns:repeat(3,minmax(0,1fr))}
  #dash > #hero{grid-column:span 2}
  #dash > #weekCard{grid-column:span 2}
}
@media (min-width:1000px){
  :root{--sbw:248px}
  body.app .tabbar{inset:0 auto 0 auto;inset-inline-start:0;width:var(--sbw);flex-direction:column;gap:2px;padding:16px 12px 16px;border-top:0;border-inline-end:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 70%,var(--card));-webkit-backdrop-filter:none;backdrop-filter:none;transform:none;border-radius:0;box-shadow:none}
  body.app .tabbar .sbrand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
  body.app .tabbar .sbrand img{border-radius:9px;box-shadow:0 2px 8px #2a186833}
  body.app .tabbar .sbrand b{font-size:18px;display:block;line-height:1.1}
  body.app .tabbar .sbrand .hint{font-size:12px}
  body.app .tabbar .sbset{display:flex;margin-top:auto}
  body.app .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:9px 10px;border-radius:10px;color:var(--text)}
  body.app .tabbar button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
  body.app .tabbar .ti{width:auto;height:auto;background:none!important;position:static}
  body.app .tabbar .ti .i{width:19px;height:19px;color:var(--muted)}
  body.app .tabbar button.on{background:var(--accent-soft);color:var(--accent-t)}
  body.app .tabbar button.on .i{color:var(--accent-t)}
  body.app .tabbar .badge{position:static;order:3;margin-inline-start:auto;box-shadow:none}
  body.app .tabbar button{display:flex;align-items:center}
  body.app .tabbar button .ti{display:contents}
  body.app .top,body.app main{margin-inline-start:var(--sbw)}
  body.app main{padding-bottom:40px}
  body.app .top .logo,body.app .top .ttl > span:first-child,body.app .top .by{display:none}
  body.app .ptitle{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;order:-1}
  body.app .top{gap:12px;padding-inline:28px}
  body.app .top .ttl{order:0;flex:1}
  body.app .top .ttl #upd{text-align:end}
}

/* ---------- setup ---------- */
#setup .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:10px;max-width:620px;margin-inline:auto}
#setup h2{margin:0 0 6px;font-size:20px}
#setup label{display:block;font-weight:600;margin:14px 0 6px}
#setup input{direction:ltr;text-align:left}
#setup .step{margin:14px 0}
.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:11px 14px;margin-top:8px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent)}
details{margin:10px 0}
summary{cursor:pointer;padding:4px 0;font-weight:600}
/* versions + reminders */
.betatag{font-size:10.5px;font-weight:800;letter-spacing:.06em;background:var(--warn);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:3px}
.wnv{margin:8px 0 14px}
.wnh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.wnh small{color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.wnq,.wnnew{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--row);color:var(--muted)}
.wnnew{background:var(--accent-soft);color:var(--accent-t)}
.wnfrom{margin:2px 0 8px}
.calbtns{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.calbtns.busy{opacity:.5;pointer-events:none}

/* first-run tour */

/* tour pictures, drawn with the app's own pieces */
.tm-hero{border-radius:14px;color:#fff;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,#fa7a17 72%,#000),color-mix(in srgb,#fa7a17 55%,#3b1470))}

.tm-steps{display:grid;gap:8px;font-size:14px}

/* setup guide */
.gsteps{list-style:none;margin:14px 0 6px;padding:0;display:grid;gap:12px}

.langrow{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 4px}
.langrow select{font-size:14px;padding:5px 8px}

/* ---------- dashboard ---------- */

.tile.ring .rt{display:flex;flex-direction:column}
.tile:active{transform:scale(.98)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:0;background:none;padding:4px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:132px}
.wd .dn{font-size:11.5px;color:var(--muted)}
.wd .dd{font-size:15px;font-weight:700;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.wd.today .dd{background:var(--accent);color:var(--on-accent)}
.wd .bars{display:flex;flex-direction:column;gap:3px;width:100%;align-items:center;flex:1}

.wd .bar.mn{background:color-mix(in srgb,var(--c) 30%,var(--card));border:2px dashed var(--c)}.wd .bar.mn.dn2{background:transparent;opacity:.55}
.md .dot.mn{border-radius:1px;transform:rotate(45deg);width:7px;height:7px}
.wlg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin-top:8px;font-size:11.5px;color:var(--muted)}.wlg span{display:inline-flex;align-items:center;gap:5px}
.wlg .lg.bar{display:inline-block;width:18px;height:9px;border-radius:3px;background:var(--c)}.wlg .lg.bar.dn2{background:transparent;border:1.5px solid var(--c)}.wlg .lg.bar.mn{background:color-mix(in srgb,var(--c) 30%,var(--card));border:1.5px dashed var(--c)}
.wlg .lg.bar.xm{background:repeating-linear-gradient(135deg,var(--c),var(--c) 3px,color-mix(in srgb,var(--c) 45%,var(--card)) 3px,color-mix(in srgb,var(--c) 45%,var(--card)) 6px)}
.wlg .lg.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}.wlg .lg.dot.dn2{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}.wlg .lg.dot.mn{border-radius:1px;transform:rotate(45deg);width:7px;height:7px}.wlg .lg.dot.xm{border-radius:2px;box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--c)}
.wd .more{font-size:11px;color:var(--muted)}
.wd .cnt{font-size:11.5px;font-weight:700;color:var(--muted);min-height:16px}
.wd.sel,.md.sel{outline:2px solid var(--accent);outline-offset:-2px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.md{border:0;background:var(--row);border-radius:10px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.md.out{background:none;opacity:.35}
.md.past{opacity:.6}
.md .d{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.md.today .d{background:var(--accent);color:var(--on-accent)}
.md .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.md .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.md .dot.dn2{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.md .pl{font-size:10px;color:var(--muted);line-height:1}

.mnav{display:flex;gap:4px}
.mnav button{padding:4px 10px}
.load .lr{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:10px;width:100%;border:0;background:none;text-align:start}
.load .lr .ln{width:38%;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load .lr .lb{flex:1;height:12px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.load .lr .lb i{display:block;height:100%;background:var(--c)}
.load .lr .lb i.lt{background:repeating-linear-gradient(45deg,var(--c),var(--c) 4px,color-mix(in srgb,var(--c) 55%,#fff) 4px,color-mix(in srgb,var(--c) 55%,#fff) 8px)}
.load .lr .lc{font-size:12.5px;color:var(--muted);min-width:26px;text-align:end;font-variant-numeric:tabular-nums}
.dact{display:flex;flex-direction:column;gap:6px}
.dact button{width:100%}
.ch .link{padding:2px 4px;font-weight:600;font-size:14px}
.ch>span:last-child{display:inline-flex;align-items:center;gap:6px}
.ch .addpill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px 5px 10px;border:0;border-radius:99px;font-weight:700;font-size:13.5px;
  background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent-t);cursor:pointer}
.ch .addpill .i{width:16px;height:16px}
.chinv{text-align:center;padding:28px 20px}.chinv h2{margin:6px 0}.chinvi{font-size:44px}.chinv .primary{margin-top:10px}

/* semester progress: one dashed piece per week, the current week fills day by day */
.sem .big{font-size:22px;font-weight:800;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.sem .big small{font-size:14px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.sem .big small.pc{margin:0;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-t);font-size:12.5px}
.sem .sub{color:var(--muted);font-size:14px;margin:2px 0 12px}
.sem .sub b{color:var(--text)}
.sbar{display:flex;gap:4px;align-items:center;height:16px}
.sg{position:relative;height:12px;border-radius:4px;background:var(--track);overflow:visible;min-width:3px}
.sg>b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:var(--accent)}
.sg.x{background:color-mix(in srgb,var(--warn) 22%,var(--track))}
.sg.x>b{background:var(--warn)}
.sg.gap{height:2px;background:none;border-top:2px dotted var(--line)}
.sg.cur{height:16px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.sg.x.cur{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 40%,transparent)}
.sg.cur>b::after{content:"";position:absolute;inset-inline-end:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.sg.x.cur>b::after{border-color:var(--warn)}
.snum{display:flex;gap:4px;margin-top:4px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.snum span{text-align:center;min-width:3px;overflow:hidden}
.snum span.cur{color:var(--accent-t);font-weight:800}
.slbl{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.slbl .xl{color:var(--warn);font-weight:600}
.sem .guess{margin-top:8px;font-size:12.5px;color:var(--muted)}
.sem .guess button{font-size:12.5px;padding:0 4px}

/* today's classes */
.tr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--row);border-inline-start:5px solid var(--c);margin-bottom:6px;width:100%;border-block:0;border-inline-end:0;text-align:start}
.tr .tm{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:42px;line-height:1.3}
.tr .tb{flex:1;min-width:0;display:flex;flex-direction:column}
.tr .tb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .tb small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ts{font-size:12.5px;font-weight:700;color:var(--muted);text-align:end}
.tr.past{opacity:.5}
.tr.now{background:color-mix(in srgb,var(--c) 16%,var(--card));box-shadow:0 0 0 2px var(--c)}
.tr.now .ts{color:var(--ct,var(--text))}
.tr.next .ts{color:var(--accent-t)}
.today .nx{color:var(--muted);font-size:14px;margin-top:4px}
.today .nx b{color:var(--text)}

/* weekly timetable */
.tt{--pph:58px}
.ttb{display:flex;gap:6px}
.ttb button{padding:6px 12px;font-size:14px}
.ttgrid{display:grid;grid-template-columns:34px repeat(var(--nd),minmax(0,1fr));column-gap:4px}
.ttgrid .th{text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);padding:4px 0 6px}
.ttgrid .th.on{color:var(--accent-t)}
.ttgrid .th.on span{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:1px 8px}
.tthr{position:relative;height:calc(var(--pph) * var(--rows))}
.tthr span{position:absolute;inset-inline-end:2px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tthr span:first-child{transform:none}
.ttc{position:relative;height:calc(var(--pph) * var(--rows));border-radius:10px;background-color:var(--row);
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--pph))}
.ttc.on{background-color:var(--accent-soft)}
.tte{position:absolute;border:0;border-radius:9px;padding:4px 3px;overflow:hidden;color:#fff;text-align:start;display:flex;flex-direction:column;gap:1px;
  background:var(--c);font-size:11.5px;line-height:1.25;box-shadow:0 1px 0 #0001}
.tte b{font-size:11.5px;line-height:1.2;overflow-wrap:break-word}
.tte span{opacity:.92;overflow-wrap:break-word}
.tte .tk,.tte .tm{display:none}
.tte.now{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.ttnow{position:absolute;inset-inline:-3px;height:2px;background:var(--err);z-index:2;pointer-events:none}
.ttnow::before{content:"";position:absolute;inset-inline-start:-3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--err)}
.ttempty{padding:18px 6px;color:var(--muted);text-align:center;line-height:1.6}
.ttempty .eb2{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:12px auto 0}
@media (min-width:760px){ .tt{--pph:54px} .tte{font-size:12px;padding:5px 7px} .tte b{font-size:13.5px} .tte .tk,.tte .tm{display:block} .tte .pl{order:2} .tte .tk{order:1} .tte .tm{order:3} }

/* exams */
.er{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:8px 10px;border-radius:12px;background:var(--row);border:0;border-inline-start:5px solid var(--c);margin-bottom:6px}
.er .eb{flex:1;min-width:0;display:flex;flex-direction:column}
.er .eb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .eb small{color:var(--muted);font-size:12.5px;line-height:1.5}
.er .ec{text-align:center;min-width:54px;line-height:1.1}
.er .ec .en{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.er .ec .eu{font-size:11.5px;color:var(--muted)}
.er .ec .cd{font-size:12px;display:block;max-width:120px}
.er.b{opacity:.75}
.er.soon .ec .en{color:var(--warn)}
.exempty{color:var(--muted);font-size:14px}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);white-space:nowrap}
.exnote{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.xsug.lvrow{color:var(--warn);justify-content:space-between}
.exempty button{margin-top:8px;width:100%}
.er.q .eb small .qk{font-weight:700;color:var(--accent-t)}
.xqbox{background:var(--row);border-radius:14px;padding:10px 12px;margin:10px 0 14px}
.xqbox .stitle{margin-top:0}
.xqform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.xqrow{display:flex;gap:8px}
.xqrow > *{flex:1;min-width:0}
.xqrow label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.xqrow label input{width:100%;min-width:0}
.xqi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.xqi:last-child{border-bottom:0}
.xqi i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.xqi .xqt{flex:1;min-width:0;display:flex;flex-direction:column}
.xqi .xqt small{color:var(--muted);font-size:12.5px}
.xqi.past{opacity:.5}
.xqi button{padding:4px 8px}
.xrow{border-bottom:1px solid var(--line);padding:10px 0}
.xrow:last-child{border-bottom:0}
.xrow .xn{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.xrow .xn i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.xrow .xm{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:14px}
.xrow input[type=datetime-local]{width:100%;min-width:0}
.xsug{grid-column:1/-1;font-size:13px;color:var(--accent-t);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xsug button{padding:3px 10px;font-size:13px}
.md .dot.xm{border-radius:2px;width:9px;height:9px;box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--c)}
.wd .bar.xm{background:repeating-linear-gradient(135deg,var(--c),var(--c) 4px,color-mix(in srgb,var(--c) 45%,var(--card)) 4px,color-mix(in srgb,var(--c) 45%,var(--card)) 8px);height:16px}
.scl label{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:400}
.scl label i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.scl label span{flex:1;min-width:0}
.scl small{color:var(--muted)}
.ttfoot{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.ttfoot button{font-size:13px}
.tte .lk{font-size:10px;margin-inline-start:3px}
/* mandatory attendance: same colour, striped, with a darker rim */
.tte.att{background:repeating-linear-gradient(135deg,var(--c) 0 7px,color-mix(in srgb,var(--c) 80%,#000) 7px 14px);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,#000)}
.tte.att.now{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,#000),0 0 0 3px var(--card),0 0 0 5px var(--c)}
.tte.att b,.tte.att span{text-shadow:0 1px 1px #0005}
.ttleg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.ttleg i{width:20px;height:12px;border-radius:3px;background:repeating-linear-gradient(135deg,#868e96 0 4px,#495057 4px 8px)}
.tr.att{border-inline-start-style:double;border-inline-start-width:7px}
.atb{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ct,var(--text));vertical-align:1px}
input[type=datetime-local]{font:inherit;font-size:15px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-weight:400!important}

/* announcements */
.nb{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--err);border-radius:99px;padding:1px 8px;margin-inline-start:6px}
.ni{border-radius:12px;margin:0 0 6px;background:var(--row);border-inline-start:4px solid var(--c)}
.ni summary{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;list-style:none;font-weight:400}
.ni summary::-webkit-details-marker{display:none}
.ni .nt{flex:1;min-width:0;display:flex;flex-direction:column}
.ni .nt b{font-weight:600}
.ni.new .nt b{font-weight:800}
.ni.new summary::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--accent)}
.ni .nt small{color:var(--muted);font-size:12.5px}
.ni .nm{padding:0 12px 10px}
.ni pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:0 0 6px;max-height:320px;overflow:auto}
.ni .nm a.op{color:var(--accent-t);font-weight:600;text-decoration:none;font-size:14px}
.ni .files{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

/* forms (timetable editor, semester dates) */
input[type=date],input[type=time]{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;margin-bottom:10px}
.form select{width:100%}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .frow{display:flex;gap:8px;margin-top:6px}
.form .frow button{flex:1}
.form textarea{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);resize:vertical;width:100%;box-sizing:border-box}

/* ---------- tasks pane ---------- */
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner.err{background:var(--updbg);color:var(--err)}
#sum{margin:2px 2px 10px;color:var(--muted);font-size:14px}
#sum b{color:var(--text)}
#sum .late{color:var(--err)}
#sum .next{margin-top:3px}
.focus{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-t);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.focus span{flex:1}
.focus button{padding:4px 10px;background:var(--card)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{--c:#888;flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;opacity:.55;user-select:none;cursor:pointer}
.chip.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.chip.sel{background:var(--c);color:#fff;border-color:var(--c)}
.chip.sel i{background:#fff}
.chip.sel .n{color:#fffc}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip .n{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;background:var(--card)}
.seg button{flex:1;border:0;border-radius:0;padding:9px 6px;background:none;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
#q{margin-bottom:6px}
@media (min-width:1100px){ #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start} #list .grp,#list .empty{grid-column:1/-1} }
.grp{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:700;user-select:none;cursor:pointer}
.grp .tw{width:14px;color:var(--muted);font-size:13px}
.grp .cnt{font-weight:400;color:var(--muted);font-size:13px}
.grp.late{color:var(--err)}
.grp.old,.grp.nodue,.grp.done{color:var(--muted)}
.task,.grp,.chip,.tr{--ct:color-mix(in srgb,var(--c) var(--mixp),var(--mixk))}
.grp.cg{color:var(--ct);border-inline-start:5px solid var(--c);padding-inline-start:8px}
.task{--c:var(--line);position:relative;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.task.done{opacity:.85}
.task.hid{opacity:.45}
.task.hl{box-shadow:0 0 0 3px var(--accent)}
.task .x{position:absolute;inset-block-start:4px;inset-inline-end:4px;width:40px;height:40px;padding:0;border:0;background:none;color:var(--muted);font-size:15px}
.task .tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-inline-end:34px;padding-inline-start:36px}
.task .ck{position:absolute;inset-block-start:10px;inset-inline-start:10px;width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--muted);background:none;color:transparent;display:grid;place-items:center;cursor:pointer}
.task .ck .i{width:16px;height:16px}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

.task .tc .crsl{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:3px;cursor:pointer}
.crsrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 4px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.crsrow:last-child{border-bottom:0}.crsrow .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.crsrow .sw{flex:1;min-width:0;display:flex;flex-direction:column}.crsrow b{font-weight:700;font-size:14.5px}.crsrow small{color:var(--muted);font-size:12.5px}.crsrow small.late{color:var(--err)}
.crsrow .chev{width:16px;height:16px;color:var(--muted)}
#crsSheet .box.crs,#tkSheet .box.crs,#grSheet .box.crs{max-height:92vh;overflow:auto;padding-top:0}
.tkmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--muted)}
.tkmeta .crsl{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--c);filter:brightness(.8);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tkdue{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));margin:0 0 10px}
.tkdue small{color:var(--muted);font-size:12.5px}.tkdue b{font-size:17px}.tkdue .cd{font-size:15px}.tkdue .sub{font-size:13px;color:var(--muted)}
.tkgr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--ok) 10%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 30%,var(--line));margin:0 0 10px}
.tkgr>span{display:inline-flex;align-items:center;gap:6px;font-weight:650}.tkgr .i{width:17px;height:17px;color:var(--ok)}.tkgr b{font-size:18px}.tkgr small{color:var(--muted);font-size:12.5px}.tkgr .grfb{flex-basis:100%;font-size:13px;white-space:pre-wrap}
.grrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}.grrow[data-crsgo]{cursor:pointer}.grrow>.i{width:18px;height:18px;color:var(--accent-t);flex:none}.grrow.att>.i{color:#8e5bd8}
.grrow .sw{flex:1;min-width:0;display:flex;flex-direction:column}.grrow b{font-weight:650;font-size:14px}.grrow small{color:var(--muted);font-size:12px}.grrow .grfb{white-space:pre-wrap;margin-top:2px}
.grv{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:4px 8px;border-radius:10px;white-space:nowrap;background:var(--row)}.grv b{font-size:15px;font-weight:800}.grv small{font-size:11px;color:var(--muted)}
.grv.dim{background:none;color:var(--muted);font-size:12px;font-weight:600}.grt.dim{color:var(--muted);font-weight:600}

.kwadd{display:flex;gap:8px;margin-top:6px}.kwadd input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kwchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--accent-soft);color:var(--text);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.kwchip button{border:0;background:none;padding:0 6px;font-size:16px;line-height:1;color:var(--muted)}
.kwchip.add{background:none;padding:3px 10px;color:var(--accent-t);cursor:pointer}
.srow input[type=color]{width:38px;height:30px;border:0;padding:0;background:none}

.srow .cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:fit-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:40;white-space:pre-line;font-size:14px}
@media (min-width:760px){ #toast{bottom:24px} }

/* ---------- 1.5 design refresh: system-app look (iOS / macOS / Material 3) ---------- */
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
[data-ic]{display:inline-flex;align-items:center;gap:7px}
.ic .i{width:20px;height:20px}
.top{-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);background:color-mix(in srgb,var(--card) 86%,transparent)}
.ic{border-color:transparent;background:var(--row);color:var(--text)}
.dcard,.tile,.task{box-shadow:0 1px 2px #1018280a,0 1px 3px #1018280f}
.dcard{border-radius:18px;padding:16px}
.dcard .ch{font-size:15.5px}
.dcard .ch [data-ic] .i{color:var(--accent-t)}
.tile{border-radius:16px}
/* segmented controls like iOS: a sliding white pill on a grey track */
.seg{background:var(--track);border:0;border-radius:11px;padding:3px;gap:2px}
.seg button{border-radius:8px!important;padding:7px 8px;color:var(--text);font-weight:500;transition:background .15s}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 3px #0000001f,0 1px 1px #0000000d}
/* the task categories scroll sideways as chips, so no label is ever cut ("אחר" on iPhone) */
.seg.cats{display:flex;width:auto;margin:8px -2px 4px;padding:2px;background:none;gap:7px;overflow-x:auto;scrollbar-width:none;border-radius:0}
.seg.cats::-webkit-scrollbar{display:none}
.seg.cats button{flex:0 0 auto;border:1px solid var(--line)!important;border-radius:99px!important;background:var(--card);padding:7px 13px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.seg.cats button.on{background:var(--accent);border-color:var(--accent)!important;color:var(--on-accent);box-shadow:none}
.seg.cats button.on i{opacity:.9}
.seg.cats [data-ic]{gap:6px}
.mineadd{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;color:var(--accent-t);font-weight:600;background:none}
/* settings: iOS Settings — coloured icon tiles, grouped rows */
.mrow .mi{background:var(--mc,var(--accent));color:#fff;width:32px;height:32px;border-radius:8px}
.mrow .mi .i{width:19px;height:19px}
.prow{display:flex!important;align-items:center;gap:10px;width:100%;margin-top:8px;text-align:start;background:var(--row);border:0;border-radius:12px;padding:12px 14px;font-weight:500}
.prow .i{color:var(--accent-t);width:19px;height:19px}
.prow::after{content:"\203A";margin-inline-start:auto;color:var(--muted);font-size:20px;line-height:1}
[dir=ltr] .prow::after{content:"\203A"}
#bLogout .i{color:var(--err)}
#bLogout::after{content:none}
/* task cards */
.task{border-radius:16px}
.task .x .i{width:17px;height:17px}
.task .act a,.task .act button{display:inline-flex;align-items:center;gap:5px}
.task .act .i{width:16px;height:16px}
.fl .i{width:16px;height:16px}
.fk-pdf{color:#e5484d}.fk-doc{color:#3e63dd}.fk-ppt{color:#f76b15}.fk-xls{color:#30a46c}.fk-img{color:#8e4ec6}.fk-zip{color:#978365}.fk-code{color:#0090ff}.fk-lnk,.fk-gen{color:var(--muted)}
.lzseg [data-ic],.lzseg button{justify-content:center}

/* ---------- view density: detailed (default) · compact · clean ---------- */
body[data-density=compact]{font-size:14.5px}
body[data-density=compact] .dcard{padding:11px 12px;margin-bottom:8px;border-radius:14px}
body[data-density=compact] .dcard .ch{margin-bottom:6px;font-size:14.5px}
body[data-density=compact] .tile{min-height:64px;padding:9px 11px}
body[data-density=compact] .tile .n{font-size:21px}
body[data-density=compact] .stats{gap:8px;margin-bottom:8px}
body[data-density=compact] .task{padding:8px 12px;margin-bottom:6px;border-radius:12px}
body[data-density=compact] .task .tname{font-size:14.5px}
body[data-density=compact] .task .tl{gap:4px}
body[data-density=compact] .task .due{margin-top:3px;font-size:13px}

body[data-density=compact] .task .act{margin-top:4px;gap:2px 12px}
body[data-density=compact] .task .act a,body[data-density=compact] .task .act button{font-size:13px;padding:3px 0}
body[data-density=compact] .grp{margin:10px 2px 5px}
body[data-density=compact] .hero{padding:12px 14px}
body[data-density=compact] .hero .nm{font-size:17px;margin:0 0 2px}
body[data-density=compact] .hero .lbl{margin-top:4px}
body[data-density=compact] .hero .big{font-size:18px;margin-top:4px}
body[data-density=compact] .hero button{margin-top:8px;padding:6px 12px}
body[data-density=compact] .er,body[data-density=compact] .tr{padding:5px 9px;margin-bottom:4px;border-radius:10px}
body[data-density=compact] .er .ec .en{font-size:18px}
body[data-density=compact] .er .eb small .lv{display:none}
body[data-density=compact] .ni summary{padding:6px 9px}
body[data-density=compact] .ni{margin-bottom:4px}
body[data-density=compact] .wd{min-height:96px}
body[data-density=compact] .wd .bar{height:10px}
body[data-density=compact] .md{min-height:40px}
body[data-density=compact] .sem .big{font-size:18px}
body[data-density=compact] .sem .sub{margin-bottom:8px}
body[data-density=compact] .load .lr{padding:3px 4px}
body[data-density=compact] .exnote,body[data-density=compact] .sem .guess,body[data-density=compact] .dcard .ch .hint{display:none}
body[data-density=clean] .task{border-inline-start-width:1px;box-shadow:0 1px 2px #1018280a;padding:14px 16px}
body[data-density=clean] .task::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--c)}
body[data-density=clean] .task .files,body[data-density=clean] .task details,body[data-density=clean] .task .sub,body[data-density=clean] .task .st.none,body[data-density=clean] .task .st.unknown,body[data-density=clean] .task .st.na{display:none}
body[data-density=clean] #loadCard,body[data-density=clean] #icsCard,body[data-density=clean] #monthCard,body[data-density=clean] .exnote,body[data-density=clean] .sem .guess,body[data-density=clean] .dcard .ch .hint,body[data-density=clean] .er .eb small .lv{display:none!important}
body[data-density=clean] .tile{min-height:0;padding:12px 14px}
body[data-density=clean] .er,body[data-density=clean] .tr,body[data-density=clean] .ni{background:none;border-inline-start-width:3px;border-radius:0 10px 10px 0;padding-block:7px}
[dir=rtl] body[data-density=clean] .er,[dir=rtl] body[data-density=clean] .tr,[dir=rtl] body[data-density=clean] .ni{border-radius:10px 0 0 10px}
body[data-density=clean] .hero{background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--text)}
body[data-density=clean] .hero .big{color:var(--text)!important}
body[data-density=clean] .hero .crs{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--text)}
body[data-density=clean] .hero button{background:var(--card);border-color:var(--line);color:var(--accent-t)}
body[data-density=clean] .hero.done{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
body[data-density=clean] .dcard,body[data-density=clean] .tile{border-color:transparent}
body[data-density=clean] .chips{display:none}
body[data-density=clean] .task .tc{background:none;padding:0;color:var(--muted);font-weight:500}
body[data-density=clean] .task .act{justify-content:flex-end;gap:6px;margin-top:6px}
body[data-density=clean] .task .act .at{display:none}
body[data-density=clean] .task .act a,body[data-density=clean] .task .act button{width:38px;height:38px;justify-content:center;border-radius:50%;background:var(--row);padding:0}
body[data-density=clean] .task .act .i{width:18px;height:18px}
body[data-density=clean] .task .tname{font-size:16.5px}
body[data-density=clean] .task .due{color:var(--muted)}
body[data-density=clean] .task .due b{color:var(--text);font-weight:600}
/* the picker in settings */
.dens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.dens button{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.dens button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dens .pv{display:flex;flex-direction:column;gap:3px;height:58px;padding:6px;border-radius:9px;background:var(--bg);overflow:hidden}
.dens .pv i{display:block;border-radius:4px;background:var(--card);border-inline-start:3px solid var(--accent)}
.dens [data-dn=detailed] .pv i{height:22px}
.dens [data-dn=compact] .pv i{height:10px}
.dens [data-dn=clean] .pv{gap:7px}.dens [data-dn=clean] .pv i{height:18px;border-inline-start-color:transparent}
.dens small{font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.3}
/* courses page: bulk actions */
.cbulk{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cbulk button{padding:6px 11px;font-size:13px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.cbulk .i{width:15px;height:15px}
#cq{margin:4px 0 2px}
.srow .cn .act1{font-size:11px;color:var(--ok);font-weight:700;margin-inline-start:6px}

/* ---------- 1.5 · round 2 (Mendi's suggestions) ---------- */
/* phone: the overview is the home tab, in the middle, raised */
@media (max-width:599px){
  .tabbar{overflow:visible}
  .tabbar .home .ti{width:54px;height:54px;margin-top:-20px;border-radius:50%;background:var(--accent)!important;color:var(--on-accent);
    box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent),0 0 0 5px var(--card)}
  .tabbar .home .ti .i{width:25px;height:25px}
  .tabbar .home{color:var(--muted)}
  .tabbar .home.on{color:var(--accent-t)}
  .tabbar .home:not(.on) .ti{background:color-mix(in srgb,var(--accent) 82%,var(--card))!important}
}
@media (min-width:1000px){ body.app .tabbar .sbrand{order:0} body.app .tabbar .home{order:1} body.app .tabbar [data-v=tasks]{order:2} body.app .tabbar [data-v=chat]{order:3} body.app .tabbar [data-v=tt]{order:4} body.app .tabbar .sbset{order:9} }
@media (max-width:999px){ .tabbar .sbset.has-dot::after{top:4px;inset-inline-end:calc(50% - 22px)} }
@media (min-width:600px) and (max-width:999px){ .tabbar button{font-size:13.5px;padding:8px 4px} }
/* X instead of "סגירה" */
.xbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--row);color:var(--muted);display:grid;place-items:center;padding:0;flex:none}
.xbtn .i{width:18px;height:18px;stroke-width:2.4}
.xbtn:hover{color:var(--text)}
/* every window: a fixed size that scrolls inside, the title row and the X stay on top */
.sheet .box{max-height:88vh;max-height:88dvh;overscroll-behavior:contain}
.sheet .box:has(> h3:first-child){padding-top:0}
.sheet .box > h3:first-child{position:sticky;top:0;z-index:3;background:var(--card);margin:0 -16px 10px;padding:16px 16px 10px}
#sheet .box{height:min(88vh,760px);height:min(88dvh,760px)}
.tbox{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto}
/* windows slide up from below (iOS sheet); on a computer they appear in the middle */
@media (prefers-reduced-motion:no-preference){
  .sheet:not([hidden]),.tour:not([hidden]){animation:shFade .24s ease}
  .sheet:not([hidden]) > .box{animation:shUp .36s cubic-bezier(.2,.9,.25,1)}
  .tour:not([hidden]) .tbox{animation:shPop .3s cubic-bezier(.2,.9,.25,1)}
  body.intro #dash > *,body.intro #list > *,body.intro #ttv > *{animation:tin .5s cubic-bezier(.2,.8,.2,1) both}
  body.intro #dash > :nth-child(2),body.intro #list > :nth-child(2){animation-delay:.04s}
  body.intro #dash > :nth-child(3),body.intro #list > :nth-child(3){animation-delay:.08s}
  body.intro #dash > :nth-child(4),body.intro #list > :nth-child(4){animation-delay:.12s}
  body.intro #dash > :nth-child(5),body.intro #list > :nth-child(5){animation-delay:.16s}
  body.intro #dash > :nth-child(6),body.intro #list > :nth-child(6){animation-delay:.2s}
  body.intro #dash > :nth-child(n+7),body.intro #list > :nth-child(n+7){animation-delay:.24s}
}
@media (prefers-reduced-motion:no-preference) and (min-width:760px){ .sheet:not([hidden]) > .box{animation:shPop .26s cubic-bezier(.2,.9,.25,1)} }
@keyframes shFade{from{background:#0000}}
@keyframes shUp{from{transform:translateY(100%)}}
@keyframes shPop{from{opacity:0;transform:translateY(14px) scale(.97)}}
/* big banners: a quiet gradient, darker at the top right, a touch lighter at the bottom left */
.hero{background:linear-gradient(to bottom left,color-mix(in srgb,var(--c) 42%,#000),color-mix(in srgb,var(--c) 92%,#000))}
.hero.done{background:linear-gradient(to bottom left,#134a26,#37a865)}
/* refresh: only the icon turns */
.ic.spin{animation:none}
.ic.spin .i{animation:s 1s linear infinite}
/* the tasks toolbar: search + one filter button */
.tbar{display:flex;gap:8px;margin:8px 0 4px;align-items:stretch}
.tbar #q{flex:1;min-width:0;margin:0}
.fbtn{position:relative;display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:0 14px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.fbtn.act{border-color:var(--accent);color:var(--accent-t);background:var(--accent-soft)}
.fbtn .badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;font-style:normal;text-align:center}
#fSheet .seg{display:flex;width:100%}
#fSheet .seg button{flex:1}
#fSheet #sort{width:100%;margin-top:4px}
#fSheet .chips{margin-top:8px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.frow .primary{flex:1;max-width:220px}
/* suggestions + red dots */
.sugw .stitle{margin:0 2px 6px}
.sugr{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.sugr:last-child{border-bottom:0}
.sugr .mrow{border-bottom:0;flex:1;min-width:0}
.sugr .mrow::after{content:none}
.sugx{border:0;background:none;color:var(--muted);padding:10px 12px;flex:none}
.sugx .i{width:16px;height:16px}
.rdot{width:9px;height:9px;border-radius:50%;background:var(--err);flex:none}
.has-dot{position:relative}
.has-dot::after{content:"";position:absolute;top:5px;inset-inline-end:5px;width:9px;height:9px;border-radius:50%;background:var(--err);box-shadow:0 0 0 2px var(--card)}
body.app .tabbar .sbset.has-dot::after{top:12px;inset-inline-end:12px}
.sugmoved{display:none!important}
.dfoot{text-align:center;margin:6px 0 4px}
body.app:not([data-view=dash]) .dfoot{display:none}
/* squircle corners where the browser can draw them (Chrome / Android now; Safari keeps normal rounded corners) */
@supports (corner-shape: squircle){
  .dcard,.tile,.task,.sheet .box,.prow,.mgroup,.mrow .mi,.seg,.seg button,.er,.tr,.ni,.md,.ad,.acym,.dens button,.xqbox,.tbox,.hero,.ic,.fbtn,.tbar #q,button.primary,.acday,.acsoon button,.top .logo,.sbrand img{corner-shape:squircle}
  .dcard,.task,.hero{border-radius:24px}
  .mrow .mi{border-radius:11px}
}
</style>

<header class="top">
  <img class="logo" src="icon-any-192.png" alt="" width="34" height="34">
  <div class="ttl"><span><b class="wm" dir="ltr">Moodle<span>Pro</span></b> <span class="betatag" id="betaTag" hidden>BETA</span></span><span class="hint by" data-i18n="byHii"></span><span class="hint" id="upd"></span></div>
  <span class="ptitle" id="pTitle"></span>
  <button class="ic" id="bRefresh" data-i18n-aria="refresh" aria-label="רענן" hidden><svg class="i"><use href="#i-refresh-cw"/></svg></button>
  <button class="ic" id="bSet" data-i18n-aria="settings" aria-label="הגדרות" hidden><svg class="i"><use href="#i-settings"/></svg></button>
</header>

<main>
<section id="setup" hidden>
  <div class="card">
    <div class="langrow"><span aria-hidden="true">🌐</span><select class="langSel" aria-label="Language"><option value="he">עברית</option><option value="en">English</option><option value="fr">Français</option></select></div>
    <div class="brand"><img src="icon-any-192.png" alt="" width="56" height="56"><div><b class="wm" dir="ltr">Moodle<span>Pro</span></b><div class="hint by" data-i18n="byHii"></div><div class="hint" data-i18n="brandTag"></div></div></div>
    <h2 data-i18n="setupTitle"></h2>
    <div class="hint" data-i18n="setupHint"></div>
    <div class="gvid" id="gVid">
      <div class="gvt"><b data-i18n="vidTitle"></b><span class="hint" id="vidNote"></span></div>
      <div class="gvbox">
        <video id="vid" src="media/guide-iphone.mp4" poster="media/guide-iphone.jpg" muted playsinline loop preload="metadata" controls></video>
        <ol class="gvcap" id="vidCap"></ol>
      </div>
    </div>
    <ol class="gsteps">
      <li class="gstep">
        <div class="gh"><span class="gn">1</span><b data-i18n="g1Title"></b></div>
        <a class="btn primary" id="bGet" target="_blank" rel="noopener noreferrer" data-i18n="getToken"></a>
        <div class="hint" data-i18n="g1Hint"></div>
      </li>
      <li class="gstep" id="gStep2">
        <div class="gh"><span class="gn">2</span><b data-i18n="g2Title"></b></div>
        <p class="gp" data-i18n-html="g2Text"></p>
        <div class="gtabs" role="tablist">
          <button data-plat="android" role="tab" data-i18n="platAndroid"></button>
          <button data-plat="ios" role="tab" data-i18n="platIos"></button>
          <button data-plat="pc" role="tab" data-i18n="platPc"></button>
        </div>
        <div class="ill" aria-hidden="true">
          <div class="ill-bar"><span>🔒 moodle.jct.ac.il</span></div>
          <div class="ill-page">
            <i class="ill-line"></i><i class="ill-line s"></i>
            <span class="ill-link" data-i18n="illLink"></span>
            <span class="ill-finger" id="illFinger">👆</span>
            <div class="ill-menu" id="illMenu"></div>
          </div>
        </div>
        <p class="gp gdo" id="gDo"></p>
        <div class="gnote">🔑 <span data-i18n-html="g2Looks"></span></div>
        <div class="gnote warn">⚠️ <span data-i18n="step2hint"></span></div>
      </li>
      <li class="gstep">
        <div class="gh"><span class="gn">3</span><b data-i18n="g3Title"></b></div>
        <button class="primary" id="bPaste" style="width:100%" data-i18n="pasteConnect"></button>
        <div class="hint" data-i18n="g3Hint"></div>
      </li>
    </ol>
    <label for="tok" data-i18n="manual"></label>
    <input type="password" id="tok" autocomplete="off" data-i18n-ph="tokPh">
    <button id="bConnect" style="width:100%;margin-top:10px" data-i18n="connect"></button>
    <div class="err" id="setupErr"></div>
    <details>
      <summary data-i18n="otherSite"></summary>
      <input type="text" id="site" autocomplete="off">
    </details>
    <div class="hint" data-i18n-html="pcHint"></div>
  </div>
</section>

<div id="app" hidden>
  <div id="exView" class="exslot"></div>
  <div class="dtop"><button id="bDashEdit" class="dedit"><svg class="i"><use href="#i-square-pen"/></svg><span data-i18n="daEditBtn"></span></button></div>
  <section id="dash">
    <div id="hero" class="dcard hero"></div>
    <div id="aiCard" class="dcard aicard"><button id="bAi" class="aibtn"><svg class="i"><use href="#i-bot"/></svg><span data-i18n="aiBtn"></span></button></div>
    <div id="todayCard" class="dcard today">
      <div class="ch"><span id="todayTitle"></span><button class="link" id="bTtGo" data-i18n="ttOpen"></button></div>
      <div id="today"></div>
    </div>
    <div id="examCard" class="dcard exams">
      <div class="ch"><span data-i18n="examsTitle" data-ic="graduation-cap"></span><span><button class="addpill" id="bExAdd" data-i18n="xqAddShort" data-ic="plus"></button><button class="link" id="bExEdit" data-i18n="edit"></button></span></div>
      <div id="exams"></div>
    </div>
    <div id="stats" class="stats"></div>
    <div id="semCard" class="dcard sem">
      <div class="ch"><span data-i18n="semTitle" data-ic="flag"></span><span><button class="link" id="bAcadGo" data-i18n="acGo" hidden></button><button class="link" id="bSemEdit" data-i18n="edit"></button></span></div>
      <div id="sem"></div>
    </div>
    <div id="weekCard" class="dcard">
      <div class="ch"><span data-i18n="weekTitle" data-ic="calendar-days"></span><span class="hint" data-i18n="tapDay"></span></div>

 themes, or build your own. At the top you can also pick the logo shown at the top of the app.", ex_exams: "Exams and quizzes\nYour courses’ exam dates (from Levnet, when published), and quizzes and exams you add yourself. They show on the overview, the course page and in reminders.", ex_mine: "Your own task\nSomething that isn’t in Moodle: reading, studying for an exam, anything. It shows with your other tasks and gets reminders like any assignment.", ex_fb: "Tell us\nWhat works, what doesn’t and what’s missing. Every message is read. Your name, courses and version are sent with it so the problem can be checked. You can attach a screenshot.", ex_socChat: "A conversation\nWrite here to everyone in the course. React with an emoji, reply to a specific message, and ⭐ an answer that helped (it gives the writer points).", ex_board: "The leaderboard\nPoints come from helping others: sharing a quiz, reporting how long a task took, adding the WhatsApp group and answers marked ⭐. See the overall ranking or one course.", ex_daSheet: "Arrange the overview\nChange the order of the cards with the arrows, and turn off cards you don’t need. You can go back to the original order at any time.", ex_cal: "A calendar that updates itself\nAdds your deadlines and exams to your phone’s calendar (Google or iPhone), and it updates by itself when something changes in Moodle.", ex_ttEdit: "A class in the timetable\nName, day, hours and place. For a Zoom class you can get a reminder before it. ✋ marks compulsory attendance.",

    dd_aiCard: "Copier tous vos devoirs et examens vers un assistant IA en un geste", dd_coursesCard: "Vos cours, chacun ouvre sa page", dd_gradesCard: "Votre note dans chaque cours et la dernière reçue", dd_loadCard: "Combien de devoirs ouverts par cours", dd_icsCard: "État des rappels et de l’agenda",
    exOk: "Compris", exReset: "Afficher à nouveau les courtes explications", exResetDone: "Les explications s’afficheront à nouveau partout", ex_dash: "Voici l’aperçu\nD’un coup d’œil : les retards, ce qui est dû aujourd’hui et cette semaine, les examens, vos cours et les annonces. Touchez un élément pour y aller.\nVous pouvez réordonner et masquer les cartes : Paramètres → Apparence et affichage → Organiser l’aperçu.", ex_tasks: "Toutes vos tâches au même endroit\nDevoirs, tests et vos propres tâches de tous les cours, par urgence : aujourd’hui, plus tard cette semaine, la semaine prochaine et plus tard.\nLe ✓ marque une tâche comme faite (annulable), le ✕ de l’autre côté la masque. Touchez une tâche pour ouvrir sa page détaillée, ou le nom du cours pour ouvrir la page du cours.\nUn devoir rendu a ⏳ « Combien de temps ? » – à indiquer ou modifier à tout moment.", ex_tt: "Emploi du temps et calendrier universitaire\nVos cours et les dates du semestre, des fêtes et des examens. Importez l’emploi du temps depuis Levnet ou créez-le vous-même, et recevez un rappel avant chaque cours.", ex_chat: "Toutes vos conversations\nChaque cours a un chat, et chaque devoir sa propre discussion. Chaque ligne indique où elle appartient : « Chat du cours », ou « Discussion du devoir » et le cours.\n« Actives » montre seulement là où quelqu’un a écrit. Pour en commencer une, allez à « Cours » et choisissez un cours.", ex_settings: "Les paramètres par thème\nNotifications et rappels, apparence et couleurs, filtres, cours, dates du semestre, compte et synchronisation, et aide. Un point rouge signale une suggestion pas encore vue.", ex_crs: "La page du cours\nTout ce qui concerne le cours au même endroit : ce qui est ouvert et la suite, examens et tests, ses cours dans l’emploi du temps, tous les fichiers et thèmes de Moodle (avec recherche), son chat et son groupe WhatsApp, et sa couleur dans l’appli.", ex_rem: "Quand vous le rappeler\nChoisissez combien de temps avant une échéance, un examen et un cours, et un résumé du matin à l’heure voulue. « + Autre durée » ajoute n’importe quelle durée.\nLes rappels arrivent en notification, dans le calendrier du téléphone, ou les deux.", ex_themes: "L’apparence de l’appli\nThèmes clairs, pastel, vifs et sombres, ou votre propre thème. En haut, choisissez aussi le logo affiché en haut de l’appli.", ex_exams: "Examens et tests\nLes dates d’examen de vos cours (de Levnet, quand elles sont publiées), et les tests et examens que vous ajoutez. Ils apparaissent dans l’aperçu, la page du cours et les rappels.", ex_mine: "Votre propre tâche\nQuelque chose qui n’est pas sur Moodle : lecture, révision, n’importe quoi. Elle apparaît avec vos tâches et reçoit des rappels comme un devoir.", ex_fb: "Dites-nous\nCe qui marche, ce qui ne marche pas et ce qui manque. Chaque message est lu. Votre nom, vos cours et la version sont envoyés avec, pour pouvoir vérifier. Vous pouvez joindre une capture d’écran.", ex_socChat: "Une conversation\nÉcrivez ici à tout le cours. Réagissez avec un émoji, répondez à un message précis, et mettez ⭐ à une réponse utile (cela donne des points à son auteur).", ex_board: "Le classement\nLes points viennent de l’aide aux autres : partager un test, indiquer le temps d’un devoir, ajouter le groupe WhatsApp et les réponses marquées ⭐. Classement général ou par cours.", ex_daSheet: "Organiser l’aperçu\nChangez l’ordre des cartes avec les flèches et désactivez celles dont vous n’avez pas besoin. Vous pouvez revenir à l’ordre d’origine à tout moment.", ex_cal: "Un calendrier qui se met à jour seul\nAjoute vos échéances et examens au calendrier du téléphone (Google ou iPhone), et il se met à jour seul quand quelque chose change sur Moodle.", ex_ttEdit: "Un cours dans l’emploi du temps\nNom, jour, heures et lieu. Pour un cours Zoom, vous pouvez recevoir un rappel avant. ✋ indique une présence obligatoire.",
    fbShot: "Joindre une capture d’écran", fbShotHint: "Faites une capture (sur téléphone : bouton latéral + volume haut) et choisissez-la dans la galerie.", fbShotDel: "Retirer l’image", fbShotBad: "Impossible de lire cette image. Essayez-en une autre.", fbShotFail: "l’image n’a pas été envoyée",

async function fetchContents(d) {
  const open = d.tasks.filter(x => x.cmid && !isDone(x) && !isOff(x.cid));
  const cids = [...new Set(open.map(x => x.cid))];
  const want = new Set(d.tasks.map(x => x.cmid).filter(Boolean));
  const res = await pool(cids, 3, async cid => { try { return [cid, await call("core_course_get_contents", { courseid: cid })]; } catch (e) { return [cid, null]; } });
  const out = Object.assign({}, d.contents || {});
  for (const [cid, secs] of res) {
    if (!Array.isArray(secs)) continue;
    const mods = {}, kept = [];
    for (const sec of secs) {
      const ms = sec.modules || [];
      if (!ms.some(m => want.has(Number(m.id)))) continue;
      const items = [];
      for (const m of ms) {
        if (want.has(Number(m.id))) { mods[m.id] = kept.length; continue; }
        if (m.modname === "url") { const c = (m.contents || [])[0]; if (c && c.fileurl) items.push({ n: stripHtml(m.name), u: c.fileurl, link: 1 }); continue; }
        if (m.modname !== "resource" && m.modname !== "folder") continue;

      }

async function syncNow(manual) {

    const uid = await myUserId();

    if (!su) LS.set("syncUid", uid);

    try { pulled = await round(); }

      if (!blockedErr(e) || LS.get("syncStore", "files") === "cal") throw e;

      try { pulled = await round(); } catch (e2) { LS.del("syncStore"); throw new MErr(t("syncBlocked") + " (" + e.message + " / " + e2.message + ")", e2.code); }

}

/* a screenshot from the gallery, made smaller on the phone (at most 1400 px, JPEG) before it is sent */

async function fbShrink(file) {

/* ---------- "send to my AI": everything academic as clear text, to paste into any assistant (ChatGPT, Gemini, Claude, Grok…) ---------- */
const AI_PARTS = ["open", "exams", "tt", "sem", "done", "courses"];
const AI_ASKS = ["plan", "urgent", "exams", "week", "none"];
const AI = { ask: LS.get("aiAsk", "plan"), parts: Object.assign({ open: true, exams: true, tt: true, sem: true, done: false, courses: true }, LS.get("aiParts", {})) };
function aiDate(ts, allDay) {
  const d = new Date(ts * 1000), ymd = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const wd = d.toLocaleDateString(t("locale"), { weekday: "long" });
  return wd + " " + ymd + (allDay ? "" : " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"));
}
function aiText() {
  const d = V.data; if (!d) return "";
  const now = nowS(), L = [], P2 = AI.parts, cname = cid => { const c = d.courses.find(y => y.id === cid); return c ? shortName(c.name) : ""; };
  const inDays = ts => { const n = Math.round((ts - now) / DAY); return n === 0 ? t("aiToday") : n > 0 ? t("aiIn", n) : t("aiAgo", -n); };
  L.push("# " + t("aiH"));
  L.push(t("aiMade", aiDate(now), APP_VERSION));
  if (d.name) L.push(t("aiName", d.name));
  const ask = AI.ask !== "none" ? t("aiQ_" + AI.ask) : "";
  if (ask) L.push("", "## " + t("aiHAsk"), ask);
  L.push("", t("aiNote"));
  const tasks = d.tasks.filter(x => counted(x) && !isOff(x.cid) && !P.hidden.includes(x.key));
  const line = x => {
    const est = estOf(x), parts = ["[" + (cname(x.cid) || shortName(x.course || "")) + "] " + x.name, typeLabel(x)];
    parts.push(x.due ? t("aiDue", aiDate(x.due), inDays(x.due)) : t("aiNoDue"));
    parts.push(x.status === "submitted" ? t("stSubmitted") : isManual(x) ? t("aiMarked") : x.status === "draft" ? t("stDraft") : t("aiNotSub"));
    if (x.from && x.from > now) parts.push(t("aiOpens", aiDate(x.from)));
    if (x.cutoff) parts.push(t("aiCutoff", aiDate(x.cutoff)));
    if (est) parts.push(t("aiEst", est < 1 ? t("h1") : "~" + Math.round(est * 10) / 10));
    if (x.url) parts.push(x.url);
    return "- " + parts.filter(Boolean).join(" · ");
  };
  if (P2.open) {
    const open = tasks.filter(x => !isDone(x) && groupOf(x, now) !== "old").sort((a, b) => dueKey(a) - dueKey(b));
    const late = open.filter(x => x.due && x.due < now), rest = open.filter(x => !x.due || x.due >= now);
    L.push("", "## " + t("aiHOpen", rest.length)); L.push(...(rest.length ? rest.map(line) : [t("aiNone")]));
    if (late.length) { L.push("", "## " + t("aiHLate", late.length)); L.push(...late.map(line)); }
  }
  if (P2.exams) {
    const ex = examList().filter(x => x.ts >= now - DAY).sort((a, b) => a.ts - b.ts);
    L.push("", "## " + t("aiHExams", ex.length));
    L.push(...(ex.length ? ex.map(x => "- [" + (cname(x.cid) || x.n || t("other")) + "] " + exLbl(x) + " · " + aiDate(x.ts, x.allDay) + (x.allDay ? " (" + t("aiAllDay") + ")" : "") + " · " + inDays(x.ts) + (x.lev ? " · " + t("exLev") : "")) : [t("aiNone")]));
  }
  if (P2.tt) {
    const tt = (P.tt || []).slice().sort((a, b) => a.day - b.day || hm(a.s) - hm(b.s));
    L.push("", "## " + t("aiHTT"));
    L.push(...(tt.length ? tt.map(x => "- " + dayName(x.day) + " " + x.s + (x.e ? "–" + x.e : "") + " · " + ttName(x) + " · " + ttKind(x) + (x.place ? " · " + x.place : "") + (isZoom(x) ? " · Zoom" : "") + (x.who ? " · " + x.who : "") + (x.att ? " · " + t("aiAtt") : "")) : [t("aiNoTT")]));
  }

  const dl = e.target.closest("[data-xqd]"); if (dl) { const gone = (P.xq || []).find(q => q.id === dl.dataset.xqd); if (gone) S("unshare", gone); P.xq = (P.xq || []).filter(q => q.id !== dl.dataset.xqd); if (V.xqEdit === dl.dataset.xqd) V.xqEdit = ""; savePrefs(); render(); renderXq(); }
});

  if (nl) { const cid = Number(nl.dataset.nolev), x = Object.assign({}, P.exams[cid]); if (x.noLev) delete x.noLev; else x.noLev = true;

  const b = e.target.closest("[data-exuse]"); if (!b) return;

};

/* back after a while away (1 hour by default): start again from the overview, like opening the app fresh, and quietly look for a new version */
let awayAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { awayAt = Date.now(); return; }
  const mins = [0, 30, 60, 180].includes(P.away) ? P.away : 60;
  if (!awayAt || !mins || Date.now() - awayAt < mins * 60000 || !M.token || $("#setup") && !$("#setup").hidden) return;
  awayAt = 0; useHit("awayBack");
  $$(".sheet:not([hidden])").forEach(sh => { if (!sh.querySelector("input:focus,textarea:focus")) sh.hidden = true; });
  if (!$("#tour").hidden) closeTour();
  V.focus = null; V.hl = null; setView("dash"); render(); window.scrollTo(0, 0);
  updQuiet();
});
async function updQuiet() {          // a newer version on the site: reload into it right away (the person just came back, nothing is lost)
  try {
    const r = await fetch("index.html", { cache: "reload" }); if (!r.ok) return;
    const v = (/const APP_VERSION = "([^"]+)"/.exec(await r.text()) || [])[1];
    if (v && v !== APP_VERSION && !/beta/.test(APP_VERSION) === !/beta/.test(v)) { await fetch("./", { cache: "reload" }).catch(() => null); location.reload(); }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !M.token) return;
  if (!V.data || Date.now() / 1000 - V.data.at > 20) refresh(); else syncSoon(400);      // back in the app: fresh data (unless it was just loaded)
});
setInterval(() => { if (!document.hidden && M.token && V.data && Date.now() / 1000 - V.data.at >= 300) refresh(); }, 30000);   // open on screen: every 5 minutes
setInterval(() => { if (!document.hidden && V.data) render(); }, 60000);
setInterval(tick, 1000);
window.addEventListener("online", () => { if (M.token) refresh(); });

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadSw = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "updated") showUpd(); });
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSw) showUpd(); });
}
function showUpd() { if (!$("#updBar").hidden) return; useHit("updBar"); $("#updBar").hidden = false; }
/* the stored copy of the page is refreshed in the background on every open: if it's a newer version than the one running, say so */
async function updWaiting() {
  try {
    if (!window.caches || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
    const here = location.href.split("#")[0].split("?")[0], r = await caches.match(here) || await caches.match(new URL("index.html", here).href);
    const v = r && (/const APP_VERSION = "([^"]+)"/.exec(await r.text()) || [])[1];
    if (v && v !== APP_VERSION) showUpd();
  } catch (e) {}
}
[4000, 12000].forEach(ms => setTimeout(updWaiting, ms));
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(updWaiting, 4000); });
$("#updGo").onclick = () => { useHit("updGo"); location.reload(); };
async function checkUpd() {
  const b = $("#bUpd"); useHit("updCheck"); b.disabled = true;
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update().catch(() => {});
    // asked with cache "reload": the service worker goes to the network for these and keeps what it gets, so a reload shows it
    const [r] = await Promise.all([fetch("index.html", { cache: "reload" }), fetch("./", { cache: "reload" }).catch(() => null)]);
    if (!r.ok) throw new Error(r.status);
    const v = (/const APP_VERSION = "([^"]+)"/.exec(await r.text()) || [])[1];
    if (v && v !== APP_VERSION) { toast(t("updFound", v), 4000); setTimeout(() => location.reload(), 900); }
    else toast(t("updNone", APP_VERSION), 4000);
  } catch (e) { toast(t("updFail"), 4000); }
  b.disabled = false;
}
$("#bUpd").onclick = checkUpd;
if (pushSupported()) setTimeout(() => pushKey().catch(() => {}), 2500);
applyLang();
importFromHash();
if (LS.get("token", "")) showMain(); else showSetup();
