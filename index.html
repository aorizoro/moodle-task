<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>משימות Moodle</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3b5bdb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משימות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --mixk:#000; --mixp:68%;
  --bg:#f4f6fb; --card:#ffffff; --text:#1d2433; --muted:#667085; --line:#e4e8f1;
  --accent:#3b5bdb; --accent-d:#2f49b3; --accent-soft:#e8edff; --ok:#2b8a3e; --warn:#e8590c; --err:#c92a2a;
  --new:#1c7ed6; --newbg:#e7f1fd; --updbg:#fff0e0; --okbg:#e6f6ea; --row:#f7f8fc; --track:#eceff5;
}
@media (prefers-color-scheme: dark){
  :root{
    --mixk:#fff; --mixp:88%;
    --bg:#12151d; --card:#1a1f2b; --text:#e7eaf2; --muted:#98a2b3; --line:#2a3141;
    --accent:#7c93ff; --accent-d:#9aabff; --accent-soft:#252d4d; --ok:#69db7c; --warn:#ffa94d; --err:#ff8787;
    --new:#74c0fc; --newbg:#1c2b3d; --updbg:#3a2a1a; --okbg:#1d3326; --row:#202637; --track:#252a36;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Heebo",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.link{border:0;background:none;color:var(--accent);padding:6px 4px}
button:disabled{opacity:.5}
input[type=text],input[type=search],input[type=password],select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
select{width:auto}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--err)}
[hidden]{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.top .ttl b{font-size:18px}
.top .ttl .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;padding:0;font-size:19px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.ic.spin{animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
main{max-width:720px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* ---------- layout: phone = one pane + bottom tabs, tablet/desktop = side by side ---------- */
body.app main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.app[data-view=dash] #tasks{display:none}
body.app[data-view=tasks] #dash{display:none}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:12;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 10px max(8px,env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px;color:var(--muted);padding:6px 4px;border-radius:12px}
.tabbar button span{font-size:20px;line-height:1.1}
.tabbar button.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabbar .b{position:relative}
.tabbar .badge{position:absolute;inset-block-start:2px;inset-inline-end:calc(50% - 26px);min-width:18px;padding:0 5px;border-radius:99px;background:var(--err);color:#fff;font-size:11px;font-weight:700;font-style:normal}
@media (min-width:760px){
  main{max-width:1320px}
  body.app main{padding-bottom:30px}
  #app{display:grid;grid-template-columns:minmax(290px,40%) minmax(0,1fr);gap:16px;align-items:start}
  body.app #dash,body.app #tasks{display:block!important}
  #dash{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto;padding-inline-end:2px}
  .tabbar{display:none!important}
}
@media (min-width:1100px){ #app{grid-template-columns:400px minmax(0,1fr);gap:18px} }
@media (min-width:1300px){ #app{grid-template-columns:440px minmax(0,1fr)} }

/* ---------- setup ---------- */
#setup .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:10px;max-width:620px;margin-inline:auto}
#setup h2{margin:0 0 6px;font-size:20px}
#setup label{display:block;font-weight:600;margin:14px 0 6px}
#setup input{direction:ltr;text-align:left}
#setup .step{margin:14px 0}
.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:11px 14px;margin-top:8px;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
details{margin:10px 0}
summary{cursor:pointer;padding:4px 0;font-weight:600}
.langrow{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 4px}
.langrow select{font-size:14px;padding:5px 8px}

/* ---------- dashboard ---------- */
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dcard .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:10px}
.dcard .ch .hint{font-weight:400}
.hero{--c:var(--accent);position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 92%,#000),color-mix(in srgb,var(--c) 70%,#4c1d95))}
.hero .gr{opacity:.9;font-size:14px}
.hero .lbl{margin-top:10px;font-size:12.5px;opacity:.85;letter-spacing:.03em}
.hero .nm{font-size:19px;font-weight:800;margin:2px 0 4px;line-height:1.3}
.hero .crs{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;background:#ffffff2e}
.hero .big{display:block;margin-top:10px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff!important}
.hero .when{font-size:13.5px;opacity:.9}
.hero button{margin-top:12px;background:#ffffff26;border:1px solid #ffffff55;color:#fff;font-weight:700}
.hero.done{background:linear-gradient(135deg,#2b8a3e,#0c8599)}
.hero .emo{font-size:34px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:84px}
.tile .n{font-size:26px;font-weight:800;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted)}
.tile.late .n{color:var(--err)}
.tile.today .n{color:var(--warn)}
.tile.ring{flex-direction:row;align-items:center;gap:10px}
.tile.ring svg{flex:none}
.tile.ring .rt{display:flex;flex-direction:column}
.tile:active{transform:scale(.98)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:0;background:none;padding:4px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:132px}
.wd .dn{font-size:11.5px;color:var(--muted)}
.wd .dd{font-size:15px;font-weight:700;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.wd.today .dd{background:var(--accent);color:#fff}
.wd .bars{display:flex;flex-direction:column;gap:3px;width:100%;align-items:center;flex:1}
.wd .bar{width:72%;height:14px;border-radius:5px;background:var(--c)}
.wd .bar.dn2{background:transparent;border:2px solid var(--c);opacity:.55}
.wd .more{font-size:11px;color:var(--muted)}
.wd .cnt{font-size:11.5px;font-weight:700;color:var(--muted);min-height:16px}
.wd.sel,.md.sel{outline:2px solid var(--accent);outline-offset:-2px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.md{border:0;background:var(--row);border-radius:10px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.md.out{background:none;opacity:.35}
.md.past{opacity:.6}
.md .d{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.md.today .d{background:var(--accent);color:#fff}
.md .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.md .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.md .dot.dn2{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.md .pl{font-size:10px;color:var(--muted);line-height:1}
.md.hasLate{box-shadow:inset 0 -3px 0 var(--err)}
.mnav{display:flex;gap:4px}
.mnav button{padding:4px 10px}
.load .lr{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:10px;width:100%;border:0;background:none;text-align:start}
.load .lr .ln{width:38%;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load .lr .lb{flex:1;height:12px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.load .lr .lb i{display:block;height:100%;background:var(--c)}
.load .lr .lb i.lt{background:repeating-linear-gradient(45deg,var(--c),var(--c) 4px,color-mix(in srgb,var(--c) 55%,#fff) 4px,color-mix(in srgb,var(--c) 55%,#fff) 8px)}
.load .lr .lc{font-size:12.5px;color:var(--muted);min-width:26px;text-align:end;font-variant-numeric:tabular-nums}
.dact{display:flex;flex-direction:column;gap:6px}
.dact button{width:100%}

/* ---------- tasks pane ---------- */
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner.err{background:var(--updbg);color:var(--err)}
#sum{margin:2px 2px 10px;color:var(--muted);font-size:14px}
#sum b{color:var(--text)}
#sum .late{color:var(--err)}
#sum .next{margin-top:3px}
.focus{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.focus span{flex:1}
.focus button{padding:4px 10px;background:var(--card)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{--c:#888;flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;opacity:.55;user-select:none;cursor:pointer}
.chip.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip .n{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;background:var(--card)}
.seg button{flex:1;border:0;border-radius:0;padding:9px 6px;background:none;font-size:14px}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
#q{margin-bottom:6px}
@media (min-width:1100px){ #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start} #list .grp,#list .empty{grid-column:1/-1} }
.grp{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:700;user-select:none;cursor:pointer}
.grp .tw{width:14px;color:var(--muted);font-size:13px}
.grp .cnt{font-weight:400;color:var(--muted);font-size:13px}
.grp.late{color:var(--err)}
.grp.old,.grp.nodue,.grp.done{color:var(--muted)}
.task,.grp,.chip{--ct:color-mix(in srgb,var(--c) var(--mixp),var(--mixk))}
.grp.cg{color:var(--ct);border-inline-start:5px solid var(--c);padding-inline-start:8px}
.task{--c:var(--line);position:relative;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.task.done{opacity:.85}
.task.hid{opacity:.45}
.task.hl{box-shadow:0 0 0 3px var(--accent)}
.task .x{position:absolute;inset-block-start:4px;inset-inline-end:4px;width:40px;height:40px;padding:0;border:0;background:none;color:var(--muted);font-size:15px}
.task .tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-inline-end:34px}
.task .tname{font-weight:700;font-size:16px;width:100%}
.task .tc{font-size:12.5px;padding:1px 9px;border-radius:99px;color:var(--ct);background:color-mix(in srgb,var(--c) 13%,transparent);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .due{margin-top:6px;font-size:14px}
.task .rel{color:var(--muted)}
.cd{color:var(--muted);font-variant-numeric:tabular-nums}
.cd.soon{color:var(--warn);font-weight:700}
.cd.late{color:var(--err);font-weight:600}
.task .sub{color:var(--muted);font-size:13px}
.task pre{white-space:pre-wrap;font:inherit;margin:6px 0;font-size:14.5px}
.task .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fl{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 10px;border-radius:10px;background:var(--row);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13.5px}
.fl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl small{color:var(--muted);flex:none}
.task .act{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;align-items:center}
.task .act a,.task .act button{color:var(--accent);text-decoration:none;font-weight:600;display:inline-block;padding:6px 0;border:0;background:none;font-size:14.5px}
.st{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.st.submitted,.st.manual{background:var(--okbg);color:var(--ok)}
.st.draft{background:var(--updbg);color:var(--warn)}
.st.none{background:var(--newbg);color:var(--new)}
.st.late{background:var(--updbg);color:var(--err)}
.st.na,.st.unknown{background:var(--track);color:var(--muted)}
.st.grade{background:var(--accent-soft);color:var(--accent)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.diag{margin-top:18px;font-size:13px;color:var(--muted)}
.diag div{direction:ltr;text-align:left;color:var(--err);word-break:break-word}

/* ---------- settings sheet ---------- */
.sheet{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px max(20px,env(safe-area-inset-bottom))}
@media (min-width:760px){ .sheet{align-items:center} .sheet .box{border-radius:18px;max-width:560px} }
.sheet h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow input[type=color]{width:38px;height:30px;border:0;padding:0;background:none}
.srow .cn{display:flex;align-items:center;gap:8px;min-width:0}
.srow .cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:fit-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:40;white-space:pre-line;font-size:14px}
@media (min-width:760px){ #toast{bottom:24px} }
</style>
</head>
<body>
<header class="top">
  <div class="ttl"><b data-i18n="appTitle">משימות</b><span class="hint" id="upd"></span></div>
  <button class="ic" id="bRefresh" data-i18n-aria="refresh" aria-label="רענן" hidden>⟳</button>
  <button class="ic" id="bSet" data-i18n-aria="settings" aria-label="הגדרות" hidden>⚙</button>
</header>

<main>
<section id="setup" hidden>
  <div class="card">
    <div class="langrow"><span aria-hidden="true">🌐</span><select class="langSel" aria-label="Language"><option value="he">עברית</option><option value="en">English</option><option value="fr">Français</option></select></div>
    <h2 data-i18n="setupTitle"></h2>
    <div class="hint" data-i18n="setupHint"></div>
    <div class="step"><b>1.</b> <span data-i18n="step1"></span>
      <a class="btn primary" id="bGet" target="_blank" rel="noopener noreferrer" data-i18n="getToken"></a></div>
    <div class="step"><b>2.</b> <span data-i18n-html="step2"></span>
      <div class="hint" data-i18n="step2hint"></div></div>
    <div class="step"><b>3.</b> <span data-i18n="step3"></span>
      <button class="primary" id="bPaste" style="width:100%" data-i18n="pasteConnect"></button></div>
    <label for="tok" data-i18n="manual"></label>
    <input type="password" id="tok" autocomplete="off" data-i18n-ph="tokPh">
    <button id="bConnect" style="width:100%;margin-top:10px" data-i18n="connect"></button>
    <div class="err" id="setupErr"></div>
    <details>
      <summary data-i18n="otherSite"></summary>
      <input type="text" id="site" autocomplete="off">
    </details>
    <div class="hint" data-i18n-html="pcHint"></div>
  </div>
</section>

<div id="app" hidden>
  <section id="dash">
    <div id="hero" class="dcard hero"></div>
    <div id="stats" class="stats"></div>
    <div class="dcard">
      <div class="ch"><span data-i18n="weekTitle"></span><span class="hint" data-i18n="tapDay"></span></div>
      <div id="week" class="week"></div>
    </div>
    <div class="dcard">
      <div class="ch"><span id="mTitle"></span><span class="mnav"><button id="mPrev" data-i18n-aria="prevMonth">‹</button><button id="mToday" data-i18n="todayBtn"></button><button id="mNext" data-i18n-aria="nextMonth">›</button></span></div>
      <div id="month" class="month"></div>
    </div>
    <div class="dcard load">
      <div class="ch"><span data-i18n="loadTitle"></span></div>
      <div id="load"></div>
    </div>
    <div class="dcard dact">
      <button id="bIcs" data-i18n="icsAll"></button>
      <div class="hint" data-i18n="icsHint"></div>
    </div>
  </section>

  <section id="tasks">
    <div id="banner" class="banner" hidden></div>
    <div id="focus" class="focus" hidden><span id="focusTxt"></span><button id="bFocusClear" data-i18n="clearFocus"></button></div>
    <div id="sum"></div>
    <div class="chips" id="chips"></div>
    <div class="ctl">
      <div class="seg" id="seg">
        <button data-f="open" class="on" data-i18n="fOpen"></button>
        <button data-f="all" data-i18n="fAll"></button>
        <button data-f="done" data-i18n="fDone"></button>
      </div>
      <select id="sort" data-i18n-aria="sort">
        <option value="urgency" data-i18n="sUrgency"></option>
        <option value="course" data-i18n="sCourse"></option>
        <option value="date" data-i18n="sDate"></option>
      </select>
    </div>
    <input type="search" id="q" autocomplete="off" data-i18n-ph="searchPh">
    <div id="list"></div>
    <div class="diag" id="diag"></div>
  </section>
</div>
</main>

<nav class="tabbar" id="tabbar" hidden>
  <button data-v="dash" class="b"><span>🏠</span><b data-i18n="viewDash"></b></button>
  <button data-v="tasks" class="b"><span>📋</span><b data-i18n="viewTasks"></b><i class="badge" id="tabBadge" hidden></i></button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h3><span data-i18n="settings"></span> <button class="link" id="bClose" data-i18n="close"></button></h3>
    <div class="srow"><span data-i18n="language"></span><select class="langSel"><option value="he">עברית</option><option value="en">English</option><option value="fr">Français</option></select></div>
    <div class="srow"><span data-i18n="oldLabel"></span><select id="old"></select></div>

function pickLang() {
  const saved = LS.get("lang", null); if (I18N[saved]) return saved;
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
  return nav.startsWith("fr") ? "fr" : "he";
}
let LANG = pickLang();
function t(key, ...a) {
  const v = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : I18N.he[key];
  return typeof v === "function" ? v(...a) : (v === undefined ? key : v);
}
function applyLang(l) {
  if (l) { LANG = I18N[l] ? l : "he"; LS.set("lang", LANG); }
  document.documentElement.lang = LANG; document.documentElement.dir = t("dir"); document.title = t("docTitle");
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));      // constant strings from I18N only
  $$("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $$(".langSel").forEach(s => s.value = LANG);
  $("#old").innerHTML = [7, 14, 30, 60, 90].map(n => '<option value="' + n + '">' + esc(t("days", n)) + "</option>").join("") + '<option value="0">' + esc(t("never")) + "</option>";
  $("#old").value = String(P.old_days);
  if (!$("#app").hidden) render();
  if (!$("#sheet").hidden) renderSheet();
}

/* ---------- connection ---------- */
function normUrl(u) {
  u = String(u || "").trim().replace(/\/+$/, "");
  if (!u) return DEFAULT_SITE;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  if (/^http:\/\//i.test(u) && !/^http:\/\/(localhost|127\.)/i.test(u)) u = "https://" + u.slice(7);
  return u.replace(/\/(login|my)(\/index\.php)?$/i, "");
}
function b64dec(s) {
  const bin = atob(String(s).replace(/-/g, "+").replace(/_/g, "/"));

function weekStartDate(now) { const d = new Date(now * 1000); d.setHours(0, 0, 0, 0); const back = (d.getDay() - t("weekStart") + 7) % 7; d.setDate(d.getDate() - back); return d; }
function ring(done, total) {

  return '<svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="7"/>' +
    '<circle cx="29" cy="29" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (c * p).toFixed(1) + " " + c.toFixed(1) + '" transform="rotate(-90 29 29)"/>' +
    '<text x="29" y="33.5" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)">' + (total ? Math.round(p * 100) + "%" : "—") + "</text></svg>";
}
function renderDash(d, now) {

  const open = rl.filter(x => !isDone(x) && x.due);
  const late = open.filter(x => groupOf(x, now) === "late"), today = open.filter(x => groupOf(x, now) === "today");
  const next7 = open.filter(x => x.due >= now && x.due < now + 7 * 86400);
  const next = open.filter(x => x.due >= now).sort((a, b) => a.due - b.due)[0];
  // hero: greeting + the next deadline, in its course colour
  const hr = new Date().getHours(), greet = t(hr < 5 ? "night" : hr < 12 ? "morning" : hr < 17 ? "noon" : hr < 22 ? "evening" : "night");
  const first = (d.user || "").trim().split(/\s+/)[0] || "";
  const hero = $("#hero"), hi = '<div class="gr">' + esc(greet) + (first ? ", <bdi>" + esc(first) + "</bdi>" : "") + "</div>";
  if (next) {
    hero.className = "dcard hero"; hero.style.setProperty("--c", colorOf(next.cid));
    hero.innerHTML = hi + '<div class="lbl">' + esc(t("upNext")) + '</div><div class="nm"><bdi>' + esc(next.name) + "</bdi></div>" +
      '<span class="crs"><bdi>' + esc(shortName(next.course)) + "</bdi></span>" + cdSpan(next.due, now, "big") + '<div class="when">' + esc(when(next.due)) + '</div><button data-goto="' + esc(next.key) + '">' + esc(t("openTask")) + "</button>";
  } else {

  const ws = weekStartDate(now).getTime() / 1000, we = ws + 7 * 86400;

  $("#stats").innerHTML =
    '<button class="tile late" data-fg="late"><span class="n">' + late.length + '</span><span class="l">' + esc(t("tLate")) + "</span></button>" +
    '<button class="tile today" data-fg="today"><span class="n">' + today.length + '</span><span class="l">' + esc(t("tToday")) + "</span></button>" +
    '<button class="tile" data-fg="next7"><span class="n">' + next7.length + '</span><span class="l">' + esc(t("tWeek")) + "</span></button>" +
    '<div class="tile ring">' + ring(wDone, thisWeek.length) + '<span class="rt"><b>' + esc(thisWeek.length ? t("progressOf", wDone, thisWeek.length) : t("noWeekTasks")) + '</b><span class="l">' + esc(t("tProgress")) + "</span></span></div>";
  // next 7 days

  for (let i = 0; i < 7; i++) {

    const items = rl.filter(x => x.due && dueDay(x) === k).sort((a, b) => isDone(a) - isDone(b) || a.due - b.due);
    const shown = items.slice(0, 5), more = items.length - shown.length;
    let wdn = ""; try { wdn = day.toLocaleDateString(t("locale"), { weekday: "short" }); } catch (e) {}
    wk += '<button class="wd' + (i === 0 ? " today" : "") + (V.focus && V.focus.kind === "day" && V.focus.d === k ? " sel" : "") + '" data-day="' + k + '" aria-label="' + esc(dayLabel(day) + ": " + items.length) + '">' +
      '<span class="dn">' + esc(wdn) + '</span><span class="dd">' + day.getDate() + '</span><span class="bars">' +
      shown.map(x => '<i class="bar' + (isDone(x) ? " dn2" : "") + '" style="--c:' + colorOf(x.cid) + '" title="' + esc(x.name) + '"></i>').join("") + "</span>" +
      (more > 0 ? '<span class="more">+' + more + "</span>" : "") + '<span class="cnt">' + (items.length || "") + "</span></button>";
  }
  $("#week").innerHTML = wk;
  // month calendar
  const m0 = new Date(base); m0.setDate(1); m0.setMonth(m0.getMonth() + V.monthOff);
  try { $("#mTitle").textContent = m0.toLocaleDateString(t("locale"), { month: "long", year: "numeric" }); } catch (e) { $("#mTitle").textContent = (m0.getMonth() + 1) + "/" + m0.getFullYear(); }
  const startPad = (m0.getDay() - t("weekStart") + 7) % 7;
  const first0 = new Date(m0); first0.setDate(1 - startPad);
  const byDay = {}; for (const x of rl) if (x.due) (byDay[dueDay(x)] = byDay[dueDay(x)] || []).push(x);
  let mh = "";
  for (let i = 0; i < 7; i++) { const wd = new Date(first0); wd.setDate(first0.getDate() + i); let n = ""; try { n = wd.toLocaleDateString(t("locale"), { weekday: "narrow" }); } catch (e) {} mh += '<span class="wh">' + esc(n) + "</span>"; }
  const weeks = Math.ceil((startPad + new Date(m0.getFullYear(), m0.getMonth() + 1, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const day = new Date(first0); day.setDate(first0.getDate() + i); const k = dayKey(day);
    const items = (byDay[k] || []).slice().sort((a, b) => isDone(a) - isDone(b)), out = day.getMonth() !== m0.getMonth();
    const hasLate = items.some(x => !isDone(x) && x.due < now);
    mh += '<button class="md' + (out ? " out" : "") + (k === dayKey(base) ? " today" : "") + (day < base ? " past" : "") + (hasLate ? " hasLate" : "") +
      (V.focus && V.focus.kind === "day" && V.focus.d === k ? " sel" : "") + '" data-day="' + k + '" aria-label="' + esc(dayLabel(day) + ": " + items.length) + '"><span class="d">' + day.getDate() + '</span><span class="dots">' +
      items.slice(0, 4).map(x => '<i class="dot' + (isDone(x) ? " dn2" : "") + '" style="--c:' + colorOf(x.cid) + '"></i>').join("") + "</span>" + (items.length > 4 ? '<span class="pl">+' + (items.length - 4) + "</span>" : "") + "</button>";
  }
  $("#month").innerHTML = mh;
  // load by course: open dated tasks (not "old"); the overdue part is striped
  const loads = {};
  for (const x of open) { if (groupOf(x, now) === "old") continue; const l = loads[x.cid] = loads[x.cid] || { n: 0, late: 0 }; l.n++; if (x.due < now) l.late++; }
  const ids = Object.keys(loads).map(Number).sort((a, b) => loads[b].n - loads[a].n), max = Math.max(1, ...ids.map(i => loads[i].n));
  $("#load").innerHTML = ids.length ? ids.map(id => {
    const c = (d.courses.find(x => x.id === id) || {}).name || "", l = loads[id];
    return '<button class="lr" data-fc="' + id + '" style="--c:' + colorOf(id) + '" title="' + esc(l.late ? t("loadLate", l.late) : "") + '"><span class="ln"><bdi>' + esc(shortName(c)) + '</bdi></span><span class="lb">' +
      (l.late ? '<i class="lt" style="width:' + (100 * l.late / max) + '%"></i>' : "") + '<i style="width:' + (100 * (l.n - l.late) / max) + '%"></i></span><span class="lc">' + l.n + "</span></button>";
  }).join("") : '<div class="hint">' + esc(t("noLoad")) + "</div>";
  const urgent = late.length + today.length, tb = $("#tabBadge");
  tb.hidden = !urgent; tb.textContent = urgent;
}

function icsExport() {
  const now = nowS(), d = V.data; if (!d) return;
  const items = d.tasks.filter(x => counted(x) && !isDone(x) && x.due && x.due > now - 86400);
  if (!items.length) return toast(t("icsNone"));
  const f = ts => new Date(ts * 1000).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const tx = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const enc = new TextEncoder();
  const fold = l => {          // RFC 5545: lines of at most 75 octets (Hebrew letters take 2)
    const out = []; let cur = "", n = 0;
    for (const ch of l) { const b = enc.encode(ch).length; if (n + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; n = 0; } cur += ch; n += b; }
    out.push(cur); return out.map((x, i) => (i ? " " : "") + x).join("\r\n");
  };
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//moodle-tasks//EN", "CALSCALE:GREGORIAN", fold("X-WR-CALNAME:" + tx(t("docTitle")))];
  for (const x of items) {
    const title = shortName(x.course) + ": " + x.name;
    L.push("BEGIN:VEVENT", "UID:" + x.key.replace(":", "-") + "@moodle-tasks", "DTSTAMP:" + f(now), "DTSTART:" + f(x.due - 1800), "DTEND:" + f(x.due),
      fold("SUMMARY:" + tx(title)), fold("DESCRIPTION:" + tx(t("calDue") + ": " + when(x.due) + "\n" + (x.url || ""))));
    if (/^https?:\/\//.test(x.url)) L.push(fold("URL:" + x.url));
    L.push("BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", fold("DESCRIPTION:" + tx(title)), "END:VALARM",
      "BEGIN:VALARM", "TRIGGER:-PT2H", "ACTION:DISPLAY", fold("DESCRIPTION:" + tx(title)), "END:VALARM", "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\r\n") + "\r\n"], { type: "text/calendar;charset=utf-8" }));
  a.download = "moodle-tasks.ics"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  toast(t("icsDone", items.length));
}
async function refresh() {

    d = await fetchAll(); applySeen(d.courses); migrateColors(d.courses); V.data = d; LS.set("cache", d);

}

$("#seg").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { P.filter = b.dataset.f; savePrefs(); render(); } });
$("#sort").onchange = e => { P.sort = e.target.value; savePrefs(); render(); };
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { V.q = e.target.value.trim(); render(); }, 120); });
$("#list").addEventListener("click", e => {
  const x = e.target.closest("[data-hide]");
  if (x) { const k = x.dataset.hide; P.hidden = P.hidden.includes(k) ? P.hidden.filter(y => y !== k) : [...P.hidden, k]; savePrefs(); render(); return; }
  const dn = e.target.closest("[data-done]");
  if (dn) { const k = dn.dataset.done; P.manual = P.manual.includes(k) ? P.manual.filter(y => y !== k) : [...P.manual, k]; savePrefs(); render(); return; }
  const g = e.target.closest("[data-g]");
  if (g) { const k = g.dataset.g, def = k.startsWith("u:") ? G_OPEN[k.slice(2)] : true; V.openG[k] = !(V.openG[k] === undefined ? def : V.openG[k]); render(); }
});
$("#dash").addEventListener("click", e => {
  const day = e.target.closest("[data-day]"); if (day) return goTasks({ kind: "day", d: day.dataset.day });
  const fg = e.target.closest("[data-fg]"); if (fg) return goTasks({ kind: "group", g: fg.dataset.fg });
  const fc = e.target.closest("[data-fc]"); if (fc) return goTasks({ kind: "course", cid: Number(fc.dataset.fc) });
  const go = e.target.closest("[data-goto]"); if (go) return gotoTask(go.dataset.goto);
});
$("#mPrev").onclick = () => { V.monthOff--; render(); };
$("#mNext").onclick = () => { V.monthOff++; render(); };
$("#mToday").onclick = () => { V.monthOff = 0; render(); };
$("#bIcs").onclick = icsExport;
$("#bFocusClear").onclick = () => { V.focus = null; render(); };
$("#tabbar").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { setView(b.dataset.v); if (b.dataset.v === "dash") V.focus = null; render(); window.scrollTo(0, 0); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && M.token && (!V.data || Date.now() / 1000 - V.data.at > 300)) refresh(); });
setInterval(() => { if (!document.hidden && V.data) render(); }, 60000);
setInterval(tick, 1000);
window.addEventListener("online", () => { if (M.token) refresh(); });

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
applyLang();
importFromHash();
if (LS.get("token", "")) showMain(); else showSetup();
</script>
</body>
</html>
